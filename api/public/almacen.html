<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almacén de bebidas</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--muted:#8b93a1;--fg:#e6e9ee;--line:#2a2f3a;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c;--accent:#4f8cff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .badge{padding:3px 10px;border-radius:999px;font-weight:600;font-size:12px}
  .badge.free{background:#20352a;color:var(--ok)}
  .badge.occ{background:#3a2b12;color:var(--warn)}
  .badge.off{background:#3a1f1f;color:var(--bad)}
  .muted{color:var(--muted)}
  main{padding:20px;display:grid;gap:20px;grid-template-columns:1fr;max-width:1400px;margin:0 auto}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  section h2{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .cams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .cam{background:#0b0d11;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cam .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-weight:600}
  .cam iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block}
  .cam .ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--muted);background:#000}
  .rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--bad)}
  .rec .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.25}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  tr.click{cursor:pointer}
  tr.click:hover{background:#20242c}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
  button.ghost{background:#262b35}
  button:disabled{opacity:.5;cursor:not-allowed}
  select,input{background:#0b0d11;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .clip-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:10px}
  .clip video{width:100%;border-radius:8px;background:#000;aspect-ratio:16/9}
  .clip .cap{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .tag.discard{color:var(--muted)}
  .tag.noshow{color:var(--warn)}
  .tag.ok{color:var(--ok)}
  .pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#262b35}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .roleline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .switch{cursor:pointer;user-select:none}
  .switch.on{color:var(--ok)}
  .switch.off{color:var(--bad)}
  /* F67/RF-77: croquis en vivo integrado en "Directo" (sin secciones nuevas). */
  .directo-wrap{display:grid;gap:12px;align-items:start}
  .croquis-card{display:flex;flex-direction:column}
  .croquis-stage{padding:10px 10px 4px}
  .croquis-stage svg{width:100%;height:auto;display:block}
  .croquis-status{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:#262b35;border:1px solid transparent;white-space:nowrap}
  .chip.ok{color:var(--ok);border-color:rgba(46,204,113,.45)}
  .chip.warn{color:var(--warn);border-color:rgba(241,196,15,.45)}
  .chip.bad{color:var(--bad);border-color:rgba(231,76,60,.45)}
  .chip.dim{color:var(--muted)}
  .croquis-meta{font-size:12px;color:var(--muted);padding:2px 10px 10px}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
  #croquis-door{transition:transform .18s cubic-bezier(.16,1,.3,1)}
  #croquis-svg.is-open #croquis-door{transform:rotate(75deg)}
  #croquis-svg.is-open #croquis-door-line{stroke:var(--ok)}
  #croquis-svg.is-unknown #croquis-door-line{stroke:var(--muted);stroke-dasharray:3 3}
  .croquis-person{transform:translate(160px,84px);transition:transform .22s cubic-bezier(.16,1,.3,1);color:var(--fg)}
  #croquis-svg.is-outside .croquis-person{transform:translate(160px,160px);color:var(--muted)}
  #croquis-svg.is-unknown .croquis-person{opacity:.4}
  .croquis-halo{transform-box:fill-box;transform-origin:center;opacity:0;transition:opacity .2s}
  #croquis-svg.is-occupied .croquis-halo{opacity:1;animation:croquis-pulse 2.2s ease-in-out infinite}
  @keyframes croquis-pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.4;transform:scale(1.12)}}
  #croquis-bulb{transition:fill .25s ease}
  #croquis-bulb-glow{transition:opacity .25s ease}
  #croquis-svg.is-light-on #croquis-bulb{fill:var(--warn)}
  #croquis-svg.is-light-on #croquis-bulb-glow{opacity:1}
  .croquis-cam .cam-rec{transition:opacity .2s}
  .croquis-cam.is-recording .cam-rec{opacity:1;animation:p 1.2s infinite}
  .croquis-cam.is-off{opacity:.35}
  /* F68/RF-78: lector QR y fases del monigote en reproducción. */
  #croquis-qr-flash{transform-box:fill-box;transform-origin:center}
  #croquis-svg.is-scanning #croquis-qr-flash{animation:qr-pulse .9s ease-in-out infinite}
  @keyframes qr-pulse{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.75;transform:scale(1.15)}}
  #croquis-svg.pos-near .croquis-person{transform:translate(180px,152px);color:var(--fg)}
  #croquis-svg.pos-qr .croquis-person{transform:translate(206px,146px);color:var(--accent)}
  #croquis-svg.pos-crossing .croquis-person{transform:translate(160px,128px);color:var(--warn)}
  #croquis-svg.pos-inside .croquis-person{transform:translate(160px,84px);color:var(--fg)}
  #croquis-svg.pos-outside .croquis-person{transform:translate(160px,160px);color:var(--muted)}
  /* F68/RF-78: banda de tiempo entre el croquis y las cámaras. */
  .directo-right{display:flex;flex-direction:column;gap:12px;min-width:0}
  .play-band{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .play-band[hidden]{display:none}
  .play-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .play-title{font-weight:600}
  .play-times{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .play-clock{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .play-sub{display:flex;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap}
  .play-inside b{color:var(--fg);font-variant-numeric:tabular-nums}
  .play-track{position:relative;padding:6px 0}
  .play-track input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;margin:0}
  .play-markers{position:relative;height:16px;margin-top:2px}
  .play-marker{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap;background:none;border:0;padding:0}
  .play-marker:hover{color:var(--fg)}
  .play-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .play-speeds{display:flex;gap:4px}
  .play-speeds .speed{padding:5px 9px}
  .play-speeds .speed.on{background:var(--accent);color:#fff}
  .replay-body{position:relative;aspect-ratio:16/9;background:#000}
  .replay-body .replay-screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .replay-body .replay-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);background:#000;font-size:12px;text-align:center;padding:8px}
  .replay-body .replay-empty[hidden]{display:none}
  .visit-play{cursor:pointer;border:1px solid var(--line);background:#262b35}
  @media (min-width:900px){.directo-wrap{grid-template-columns:minmax(280px,330px) 1fr}}
  @media (prefers-reduced-motion: reduce){
    #croquis-door,.croquis-person,.croquis-halo,#croquis-bulb,#croquis-bulb-glow{transition:none!important;animation:none!important}
    .live-dot,.croquis-cam.is-recording .cam-rec,#croquis-svg.is-scanning #croquis-qr-flash{animation:none!important}
  }
  #toast{position:fixed;bottom:16px;right:16px;background:#262b35;border:1px solid var(--line);padding:10px 14px;border-radius:10px;display:none}
</style>
</head>
<body>
<header>
  <h1 id="wh-name">Almacén</h1>
  <span id="wh-badge" class="badge off">sin configurar</span>
  <span id="wh-visit" class="muted"></span>
  <span style="flex:1"></span>
  <span id="wh-retention" class="muted"></span>
  <button id="btn-door" class="ghost" onclick="Almacen.openDoor()">Abrir puerta</button>
  <button id="btn-sync" class="ghost" onclick="Almacen.syncCameras()">Sincronizar cámaras</button>
</header>

<main>
  <section>
    <h2>Directo</h2>
    <div class="directo-wrap">
      <div class="cam croquis-card">
        <div class="bar">
          <span>Croquis <span class="pill" id="croquis-room">—</span></span>
          <span class="live-dot" id="croquis-live" title="En vivo" aria-hidden="true"></span>
        </div>
        <div class="croquis-stage">
          <svg id="croquis-svg" viewBox="0 0 320 190" role="img"
               aria-labelledby="croquis-title croquis-desc">
            <title id="croquis-title">Croquis en vivo del almacén</title>
            <desc id="croquis-desc">Estado en vivo.</desc>

            <rect x="12" y="10" width="296" height="120" rx="6" fill="var(--card)"/>
            <path d="M12 10 H308 V130 H184 M108 130 H12 Z"
                  fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
            <text x="24" y="30" font-size="9" fill="var(--muted)" letter-spacing="1">ALMACÉN</text>

            <rect x="12" y="142" width="296" height="36" rx="6"
                  fill="none" stroke="rgba(255,255,255,.06)" stroke-dasharray="4 4"/>
            <text x="160" y="166" text-anchor="middle" font-size="9" fill="var(--muted)">PASILLO</text>

            <circle id="croquis-bulb-glow" cx="160" cy="38" r="20"
                    fill="rgba(241,196,15,.14)" opacity="0"/>
            <circle id="croquis-bulb" cx="160" cy="38" r="9"
                    fill="#3a3f4a" stroke="var(--line)" stroke-width="2"/>
            <text x="160" y="60" text-anchor="middle" font-size="9" fill="var(--muted)">LUZ</text>

            <g id="croquis-door" style="transform-origin:184px 130px">
              <line id="croquis-door-line" x1="108" y1="130" x2="184" y2="130"
                    stroke="var(--bad)" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- F68/RF-78: lector QR junto a la puerta (exterior). -->
            <g id="croquis-qr" transform="translate(206,138)">
              <circle id="croquis-qr-flash" cx="0" cy="0" r="12"
                      fill="rgba(0,230,118,.35)" opacity="0"/>
              <rect x="-8" y="-7" width="16" height="14" rx="3" fill="#0b0d11" stroke="var(--line)"/>
              <rect x="-4" y="-3" width="8" height="8" fill="none" stroke="var(--muted)"/>
            </g>
            <text x="206" y="156" text-anchor="middle" font-size="7" fill="var(--muted)">QR</text>

            <circle class="croquis-halo" cx="160" cy="84" r="22"
                    fill="rgba(46,204,113,.14)" stroke="rgba(46,204,113,.35)"
                    stroke-width="1.5" opacity="0"/>

            <g class="croquis-person" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round">
              <circle cx="0" cy="-11" r="5" fill="currentColor" stroke="none"/>
              <line x1="0" y1="-6" x2="0" y2="6"/>
              <line x1="-8" y1="-1" x2="0" y2="-3"/>
              <line x1="0" y1="-3" x2="8" y2="-1"/>
              <line x1="0" y1="6" x2="-7" y2="15"/>
              <line x1="0" y1="6" x2="7" y2="15"/>
            </g>

            <g class="croquis-cam" data-position="INTERIOR" transform="translate(288,30)">
              <rect x="-13" y="-9" width="26" height="18" rx="4" fill="#0b0d11" stroke="var(--line)"/>
              <circle cx="0" cy="0" r="4" fill="#262b35" stroke="var(--line)"/>
              <circle class="cam-rec" cx="9" cy="-6" r="3" fill="var(--bad)" opacity="0"/>
            </g>
            <text x="288" y="50" text-anchor="middle" font-size="8" fill="var(--muted)">INTERIOR</text>

            <g class="croquis-cam" data-position="EXTERIOR" transform="translate(284,152)">
              <rect x="-13" y="-9" width="26" height="18" rx="4" fill="#0b0d11" stroke="var(--line)"/>
              <circle cx="0" cy="0" r="4" fill="#262b35" stroke="var(--line)"/>
              <circle class="cam-rec" cx="9" cy="-6" r="3" fill="var(--bad)" opacity="0"/>
            </g>
            <text x="284" y="174" text-anchor="middle" font-size="8" fill="var(--muted)">EXTERIOR</text>
          </svg>
        </div>
        <div class="croquis-status" id="croquis-status" aria-live="polite">
          <span class="chip dim" id="croquis-door-chip">—</span>
          <span class="chip dim" id="croquis-presence-chip">—</span>
          <span class="chip dim" id="croquis-light-chip">—</span>
        </div>
        <div class="croquis-meta" id="croquis-meta">Sin actividad reciente</div>
      </div>

      <div class="directo-right">
        <!-- F68/RF-78: banda de tiempo de la reproducción (entre croquis y cámaras). -->
        <div class="play-band" id="play-band" hidden>
          <div class="play-head">
            <span class="play-title" id="play-title">Reproduciendo visita</span>
            <span class="chip dim" id="play-phase">—</span>
            <span style="flex:1"></span>
            <button class="ghost" id="play-live" onclick="Almacen.exitPlayback()">Volver en vivo</button>
          </div>
          <div class="play-times">
            <div class="play-clock" id="play-clock">--:--:--</div>
            <div class="play-sub">
              <span id="play-window">—</span>
              <span class="play-inside">Dentro: <b id="play-inside">00:00</b></span>
            </div>
          </div>
          <div class="play-track">
            <input type="range" id="play-range" min="0" max="1000" value="0" step="1"
                   aria-label="Posición de la visita">
            <div class="play-markers" id="play-markers"></div>
          </div>
          <div class="play-controls">
            <button class="ghost" id="play-toggle" title="Reproducir/Pausar"
                    onclick="Almacen.togglePlay()">▶</button>
            <div class="play-speeds" id="play-speeds">
              <button class="ghost speed" data-speed="1" onclick="Almacen.setSpeed(1)">1×</button>
              <button class="ghost speed" data-speed="2" onclick="Almacen.setSpeed(2)">2×</button>
              <button class="ghost speed" data-speed="4" onclick="Almacen.setSpeed(4)">4×</button>
              <button class="ghost speed" data-speed="8" onclick="Almacen.setSpeed(8)">8×</button>
            </div>
            <span class="muted" style="font-size:12px" id="play-elapsed">00:00</span>
          </div>
        </div>
        <div id="cams" class="cams"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Visitas</h2>
    <div class="filters">
      <select id="f-outcome" onchange="Almacen.loadVisits()">
        <option value="">Todos los resultados</option>
        <option value="ENTERED">Entró</option>
        <option value="NO_SHOW">No entró</option>
        <option value="ANONYMOUS">Anónimo</option>
        <option value="DENIED">Denegado</option>
      </select>
      <button class="ghost" onclick="Almacen.loadVisits()">Refrescar</button>
    </div>
    <div id="visits"></div>
  </section>

  <section>
    <h2>Permisos de acceso</h2>
    <div class="row" style="justify-content:space-between">
      <div id="roles" style="min-width:260px"></div>
      <div style="min-width:320px;flex:1">
        <input id="w-search" placeholder="Buscar empleado…" oninput="Almacen.renderWorkers()" style="width:100%;margin-bottom:8px">
        <div id="workers"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>
<script src="/assets/choreography.js"></script>
<script src="/assets/croquis-logic.js"></script>
<script src="/assets/visit-playback.js"></script>
<script src="/assets/almacen.js"></script>
</body>
</html>
