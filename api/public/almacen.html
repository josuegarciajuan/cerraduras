<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almacén de bebidas</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--muted:#8b93a1;--fg:#e6e9ee;--line:#2a2f3a;--ok:#2ecc71;--warn:#f1c40f;--bad:#e74c3c;--accent:#4f8cff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  .badge{padding:3px 10px;border-radius:999px;font-weight:600;font-size:12px}
  .badge.free{background:#20352a;color:var(--ok)}
  .badge.occ{background:#3a2b12;color:var(--warn)}
  .badge.off{background:#3a1f1f;color:var(--bad)}
  .muted{color:var(--muted)}
  main{padding:20px;display:grid;gap:20px;grid-template-columns:1fr;max-width:1400px;margin:0 auto}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  section h2{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .cams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .cam{background:#0b0d11;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cam .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-weight:600}
  .cam iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;display:block}
  .cam .ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--muted);background:#000}
  .rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--bad)}
  .rec .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:p 1.2s infinite}
  @keyframes p{50%{opacity:.25}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  tr.click{cursor:pointer}
  tr.click:hover{background:#20242c}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
  button.ghost{background:#262b35}
  button:disabled{opacity:.5;cursor:not-allowed}
  select,input{background:#0b0d11;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .clip-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:10px}
  .clip video{width:100%;border-radius:8px;background:#000;aspect-ratio:16/9}
  .clip .cap{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .tag.discard{color:var(--muted)}
  .tag.noshow{color:var(--warn)}
  .tag.ok{color:var(--ok)}
  .pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#262b35}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .roleline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .switch{cursor:pointer;user-select:none}
  .switch.on{color:var(--ok)}
  .switch.off{color:var(--bad)}
  #toast{position:fixed;bottom:16px;right:16px;background:#262b35;border:1px solid var(--line);padding:10px 14px;border-radius:10px;display:none}
</style>
</head>
<body>
<header>
  <h1 id="wh-name">Almacén</h1>
  <span id="wh-badge" class="badge off">sin configurar</span>
  <span id="wh-visit" class="muted"></span>
  <span style="flex:1"></span>
  <span id="wh-retention" class="muted"></span>
  <button id="btn-door" class="ghost" onclick="Almacen.openDoor()">Abrir puerta</button>
  <button id="btn-sync" class="ghost" onclick="Almacen.syncCameras()">Sincronizar cámaras</button>
</header>

<main>
  <section>
    <h2>Directo</h2>
    <div id="cams" class="cams"></div>
  </section>

  <section>
    <h2>Visitas</h2>
    <div class="filters">
      <select id="f-outcome" onchange="Almacen.loadVisits()">
        <option value="">Todos los resultados</option>
        <option value="ENTERED">Entró</option>
        <option value="NO_SHOW">No entró</option>
        <option value="ANONYMOUS">Anónimo</option>
        <option value="DENIED">Denegado</option>
      </select>
      <button class="ghost" onclick="Almacen.loadVisits()">Refrescar</button>
    </div>
    <div id="visits"></div>
  </section>

  <section>
    <h2>Permisos de acceso</h2>
    <div class="row" style="justify-content:space-between">
      <div id="roles" style="min-width:260px"></div>
      <div style="min-width:320px;flex:1">
        <input id="w-search" placeholder="Buscar empleado…" oninput="Almacen.renderWorkers()" style="width:100%;margin-bottom:8px">
        <div id="workers"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>
<script src="/assets/almacen.js"></script>
</body>
</html>
