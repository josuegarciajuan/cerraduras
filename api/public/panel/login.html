<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerraduras — Login</title>
<script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2d3a;
  --text: #e1e4eb;
  --text-dim: #8b8fa3;
  --accent: #6c8ee0;
  --danger: #e0556a;
  --success: #4caf93;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
}
.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  width: 100%; max-width: 400px;
  box-shadow: 0 4px 24px rgba(0,0,0,.4);
}
.login-card h1 { font-size: 24px; margin-bottom: 4px; }
.login-card .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
.form-group input {
  width: 100%; padding: 10px 14px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 15px;
  transition: border-color .2s;
}
.form-group input:focus { outline: none; border-color: var(--accent); }
.btn {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  background: var(--accent); color: #fff;
  transition: opacity .2s;
}
.btn:hover { opacity: .9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.error-msg {
  background: rgba(224,85,106,.15); border: 1px solid var(--danger);
  color: var(--danger); padding: 10px 14px; border-radius: 8px;
  font-size: 13px; margin-bottom: 18px; display: none;
}
.error-msg.show { display: block; }
</style>
</head>
<body>
<div class="login-card" x-data="loginForm()">
  <h1>🔐 Cerraduras</h1>
  <p class="subtitle">Panel de control — Iniciar sesión</p>

  <div class="error-msg" :class="{ show: error }" x-text="error"></div>

  <form @submit.prevent="submit">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input id="username" type="text" x-model="username" placeholder="admin" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" x-model="password" placeholder="••••••" required>
    </div>
    <button type="submit" class="btn" :disabled="loading" x-text="loading ? 'Entrando…' : 'Entrar'"></button>
  </form>
</div>

<script>
function loginForm() {
  return {
    username: '',
    password: '',
    loading: false,
    error: '',

    async submit() {
      this.loading = true;
      this.error = '';
      try {
        const resp = await fetch('/api/v1/crm/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: this.username, password: this.password }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          this.error = data.error?.message || 'Error de autenticación';
          return;
        }
        // Redirect to panel
        window.location.href = '/panel';
      } catch (e) {
        this.error = 'Error de conexión: ' + e.message;
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>
