<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cerraduras — Panel CRM</title>
<script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e1e4eb;--dim:#8b8fa3;--accent:#6c8ee0;--danger:#e0556a;--success:#4caf93;--warning:#e0b94e;--sw:240px;--nopack-bg:rgba(224,85,106,.08);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10}
.sidebar-header{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
.sidebar-header h2{font-size:18px}.sidebar-header .ui{font-size:12px;color:var(--dim);margin-top:4px}
.sidebar nav{flex:1}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--dim);text-decoration:none;font-size:14px;transition:all .15s;cursor:pointer}
.sidebar nav a:hover{background:rgba(108,142,224,.1);color:var(--text)}
.sidebar nav a.active{color:var(--accent);background:rgba(108,142,224,.15);border-right:3px solid var(--accent)}
.sidebar nav a .ic{font-size:18px;width:22px;text-align:center}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border)}
.sidebar-footer button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px}
.sidebar-footer button:hover{color:var(--danger)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.main{flex:1;padding:24px 32px;overflow-y:auto;max-width:1500px}
.ph{margin-bottom:20px}.ph h1{font-size:22px;font-weight:700}.ph p{color:var(--dim);font-size:13px;margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.sc .lb{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.sc .vl{font-size:26px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 10px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;font-size:13px;border-bottom:1px solid rgba(42,45,58,.5)}
tr:hover td{background:rgba(108,142,224,.05)}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600;transition:opacity .15s;text-decoration:none;display:inline-block}
.btn:hover{opacity:.85}.btn-p{background:var(--accent);color:#fff}.btn-d{background:var(--danger);color:#fff}.btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:11px}.btn-xs{padding:3px 7px;font-size:10px}
.fbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.fbar input,.fbar select,.fbar button{padding:7px 12px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:90%;max-width:580px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px}.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;z-index:200;animation:slideUp .3s}
.toast-ok{background:var(--success);color:#000}.toast-err{background:var(--danger);color:#fff}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.tooltip{position:relative;display:inline-block;margin-left:4px;cursor:help;color:var(--accent);font-weight:700;font-size:13px}
.tooltip .tip{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:11px;color:var(--text);white-space:normal;width:280px;z-index:200;line-height:1.4;font-weight:400;text-align:left}
.tooltip:hover .tip{display:block}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}.tab.act{color:var(--accent);border-bottom-color:var(--accent)}.dim{color:var(--dim);font-size:12px}
.sidebar-badge{background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:auto;min-width:18px;text-align:center}
/* anomaly badges */
.sv-CRITICAL{background:rgba(224,85,106,.25);color:#e0556a;font-weight:700}
.sv-HIGH{background:rgba(224,85,106,.12);color:var(--danger)}
.sv-MEDIUM{background:rgba(224,185,78,.15);color:var(--warning)}
.sv-LOW{background:rgba(139,143,163,.12);color:var(--dim)}
.st-OPEN{background:rgba(224,85,106,.22);color:#f06070;font-weight:600}
.st-ACKNOWLEDGED{background:rgba(224,185,78,.18);color:var(--warning)}
.st-DISMISSED{background:rgba(76,175,147,.15);color:var(--success)}
.an-cat-table{font-size:12px;margin-bottom:20px}
.an-cat-table th{font-size:10px}
.an-cat-table .disabled{opacity:.35}
.an-cat-table .code{font-family:monospace;font-weight:700}
/* F38: QR token display */
.qr-token{font-family:monospace;font-size:10px;word-break:break-all;background:var(--bg);padding:10px;border-radius:6px;border:1px solid var(--accent);margin:10px 0;max-height:80px;overflow-y:auto;line-height:1.4;color:var(--accent)}
</style>
</head>
<body x-data="crm()" x-init="init()">
<aside class="sidebar">
  <div class="sidebar-header"><h2>🔐 Cerraduras</h2><div class="ui" x-text="user?.display_name||user?.username||'...'"></div></div>
  <nav>
    <a :class="{active:p==='db'}" @click="nav('db')"><span class="ic">📊</span>Dashboard</a>
    <a :class="{active:p==='ro'}" @click="nav('ro')"><span class="ic">🚪</span>Habitaciones</a>
    <a :class="{active:p==='pk'}" @click="nav('pk')"><span class="ic">📦</span>Packs</a>
    <a :class="{active:p==='dv'}" @click="nav('dv')"><span class="ic">🔌</span>Dispositivos</a>
    <a :class="{active:p==='st'}" @click="nav('st')"><span class="ic">⏱️</span>Estancias</a>
    <a :class="{active:p==='qr'}" @click="nav('qr')"><span class="ic">🎫</span>QRs</a>
    <a :class="{active:p==='dbts'}" @click="nav('dbts')"><span class="ic">💰</span>Deudas</a>
    <a :class="{active:p==='w'}" @click="nav('w')"><span class="ic">🧹</span>Trabajadores<span x-show="workerAlertCount>0" class="sidebar-badge" x-text="workerAlertCount"></span></a>
    <a :class="{active:p==='wr'}" @click="nav('wr')"><span class="ic">🏷️</span>Roles</a>
    <a :class="{active:p==='mon'}" @click="nav('mon')"><span class="ic">📋</span>Monitor</a>
    <a :class="{active:p==='us'}" @click="nav('us')"><span class="ic">👥</span>Usuarios</a>
    <a :class="{active:p==='cl'}" @click="nav('cl')"><span class="ic">🔑</span>API Clients</a>
    <a :class="{active:p==='an'}" @click="nav('an')"><span class="ic">⚠️</span>Anomalías<span x-show="anomalyCount>0" class="sidebar-badge" x-text="anomalyCount"></span></a>
    <a :class="{active:p==='he'}" @click="nav('he')"><span class="ic">❤️</span>Salud</a>
    <a :class="{active:p==='cfg'}" @click="nav('cfg')"><span class="ic">⚙️</span>Configuración</a>
  </nav>
  <div class="sidebar-footer"><button @click="logout">Cerrar sesión</button></div>
</aside>
<main class="main"><div x-html="render() || ''"></div></main>
<div x-show="toast.show" class="toast" :class="'toast-'+toast.type" x-text="toast.msg || ''" @click="toast.show=false" style="cursor:pointer"></div>
<div x-show="modal.show" class="modal-overlay" @click.self="modal.show=false"><div class="modal"><div x-html="modal.content"></div></div></div>

<script>
function crm(){return{
  user:null,p:'db',rooms:[],roomTypes:[],packs:[],stays:[],qrs:[],debts:[],events:[],pEvents:[],outbox:[],crmUsers:[],apiClients:[],anomalies:[],anomalySummary:{},anomalyCount:0,enabledTypes:['A1','A2','A3','A4','A5','A6','A7','A8'],anomalyFilters:{status:'OPEN',type:'',severity:''},newAnomalies:[],bannerDismissed:false,_seenAnomalyIds:new Set(),cfgSettings:{},
  workers:[],workerRoles:[],workersInside:[],workerAlerts:[],workerAlertCount:0,workerTab:'list',workerDetail:null,workerDetailTab:'history',workerAlertSettings:{excessiveMin:120,strangeStart:7,strangeEnd:22},
  toast:{show:false,msg:'',type:'ok'},modal:{show:false,content:''},
  stats:{t:0,f:0,o:0,ov:0,cl:0},monTab:'rooms',cfgTab:'operation',health:null,_healthTimer:null,
  deviceStatus:{},deviceStatusTick:0,

  async init(){try{let r=await fetch('/api/v1/crm/me');if(!r.ok){window.location.href='/panel/login';return}this.user=(await r.json()).user;await Promise.all([this.loadDashboard(),this.loadPacks()]);setInterval(()=>{this.checkAnomalyAlerts();this.computeWorkerAlerts()},15000)}catch(e){window.location.href='/panel/login'}},
  async api(url,opts={}){let r=await fetch(url,opts);if(!r.ok){let d=await r.json().catch(()=>({}));throw new Error(d.error?.message||'Error '+r.status)}return r.json()},
  async loadDashboard(){try{let d=await this.api('/api/v1/rooms');this.rooms=d.items||[];this.stats={t:this.rooms.length,f:this.rooms.filter(function(r){return r.status==='FREE'}).length,o:this.rooms.filter(function(r){return r.status==='OCCUPIED'}).length,ov:this.rooms.filter(function(r){return r.status==='OVERSTAY'}).length,cl:this.rooms.filter(function(r){return r.status==='CLEANING'}).length};this.loadAnomalySummary()}catch(e){}},
  async loadPacks(){try{let d=await this.api('/api/v1/device-packs');this.packs=d.items||[]}catch(e){}},
  nav(p){this.p=p;this.modal.show=false;if(this._healthTimer){clearInterval(this._healthTimer);this._healthTimer=null}if(p==='ro'){this.monTab='rooms';this.loadRoomTypes();this.loadDeviceStatus()}if(p==='dv')this.loadDevices();if(p==='pk')this.loadPacks();if(p==='st')this.loadStays();if(p==='qr')this.loadQrs();if(p==='dbts')this.loadDebts();if(p==='w')this.loadWorkers();if(p==='wr')this.loadWorkerRoles();if(p==='mon')this.loadMonitor();if(p==='us')this.loadCrmUsers();if(p==='cl')this.loadApiClients();if(p==='an'){this.loadAnomalies();this.loadEnabledTypes()}if(p==='db'){this.loadDashboard();this.loadAnomalySummary()}if(p==='he'){this.loadHealth();this._healthTimer=setInterval(function(){this.loadHealth()}.bind(this),15000)}if(p==='cfg')this.loadSettings()},
  toastOk(m){this.toast={show:true,msg:m,type:'ok'};setTimeout(()=>this.toast.show=false,3000)},
  toastErr(m){this.toast={show:true,msg:m,type:'err'};setTimeout(()=>this.toast.show=false,4000)},
  async logout(){await fetch('/api/v1/crm/logout',{method:'POST'});window.location.href='/panel/login'},
  esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')},
  statusBadge(s){let m={FREE:'Libre',OCCUPIED:'Ocupada',RESERVED:'Reservada',OVERSTAY:'Excedida',EXITED:'Salida',CLEANING:'Limpieza',OUT_OF_SERVICE:'F.Servicio',CLOSED:'Cerrada',CANCELED:'Cancelada'};return'<span class="badge" style="background:'+(s==='FREE'?'rgba(76,175,147,.2)':s==='OCCUPIED'?'rgba(108,142,224,.2)':s==='RESERVED'?'rgba(224,185,78,.2)':s==='OVERSTAY'?'rgba(224,85,106,.2)':'rgba(139,143,163,.2)')+';color:'+(s==='FREE'?'var(--success)':s==='OCCUPIED'?'var(--accent)':s==='RESERVED'?'var(--warning)':s==='OVERSTAY'?'var(--danger)':'var(--dim)')+';font-size:10px">'+(m[s]||s||'Desconocido')+'</span>'},
  tooltip(text){return'<span class="tooltip">?<span class="tip">'+text+'</span></span>'},

  // ═══ Worker methods (F38) ═══
  async loadWorkers(){try{let d=await this.api('/api/v1/workers');this.workers=d.data||[];this.computeWorkerAlerts()}catch(e){}},
  async loadWorkerRoles(){try{let d=await this.api('/api/v1/worker-roles');this.workerRoles=d.data||[]}catch(e){}},
  async loadWorkersInside(){try{let d=await this.api('/api/v1/workers/inside');this.workersInside=d.data||[]}catch(e){}},
  async computeWorkerAlerts(){
    try{let d=await this.api('/api/v1/workers/inside');this.workersInside=d.data||[]}catch(e){return}
    let alerts=[];let s=this.workerAlertSettings;
    for(let wi of this.workersInside){
      let dur=wi.duration_minutes||0;
      if(dur>s.excessiveMin)alerts.push({type:'excessive_time',msg:'⏱ '+this.esc(wi.worker.name)+' lleva '+dur+' min en '+this.esc(wi.room.code),worker:wi});
      let h=new Date(wi.entered_at+'Z').getUTCHours();
      if(h<s.strangeStart||h>=s.strangeEnd)alerts.push({type:'strange_hour',msg:'🌙 '+this.esc(wi.worker.name)+' entró a '+this.esc(wi.room.code)+' a las '+h.toString().padStart(2,'0')+':00',worker:wi});
    }
    this.workerAlerts=alerts;this.workerAlertCount=alerts.length;
  },

  render(){switch(this.p){case'db':return this.db();case'ro':return this.roomsPage();case'dv':return this.devPage();case'pk':return this.packPage();case'st':return this.stayPage();case'qr':return this.qrPage();case'dbts':return this.debtPage();case'w':return this.workersPage();case'wr':return this.workerRolesPage();case'mon':return this.monitorPage();case'us':return this.crmUserPage();case'cl':return this.apiClientPage();case'an':return this.anomalyPage();case'he':return this.healthPage();case'cfg':return this.settingsPage();default:return this.db()}},

  // ── WORKERS PAGE ──
  workersPage(){
    let that=this;
    return'<div class="ph"><h1>🧹 Trabajadores</h1><p>'+this.workers.length+' · <button class="btn btn-p btn-sm" @click="openWorkerForm()">+ Nuevo</button></p>'
      +(this.workerAlerts.length>0?'<div style="margin-bottom:12px">'+this.workerAlerts.map(function(a){return'<div style="padding:4px 8px;background:rgba(224,85,106,.15);border-radius:6px;font-size:12px;margin:3px 0">'+a.msg+'</div>'}).join('')+'</div>':'')
      +'</div><table><tr><th>Nombre</th><th>Rol</th><th>Activo</th><th>Ubicación</th><th>Último acceso</th><th>Hoy</th><th></th></tr>'
      +this.workers.map(function(w){
        let activeBadge=w.active?'<span style="color:var(--success);font-weight:700">✅</span>':'<span style="color:var(--danger)">❌</span>';
        let room=w.current_room?that.esc(w.current_room.code):'<span class="dim">—</span>';
        let last=w.last_access_at?new Date(w.last_access_at+'Z').toLocaleString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—';
        return'<tr><td style="font-weight:600">'+that.esc(w.name)+'</td><td>'+that.esc((w.role||{}).name||'—')+'</td><td>'+activeBadge+'</td><td>'+room+'</td><td>'+last+'</td><td>'+w.sessions_today+'</td><td style="display:flex;gap:4px;white-space:nowrap"><button class="btn btn-o btn-sm" @click="openWorkerDetail('+w.id+')">📋</button><button class="btn btn-o btn-sm" @click="openWorkerForm('+w.id+')">Editar</button><button class="btn btn-d btn-sm" @click="deactivateWorker('+w.id+')" '+(!w.active?'disabled':'')+'>🗑</button></td></tr>';
      }).join('')+'</table>';
  },

  openWorkerForm(id){
    let that=this;let w=id?this.workers.find(function(x){return x.id===id}):null;
    let rOpt=this.workerRoles.map(function(r){return'<option value="'+r.id+'"'+(w&&w.role_id===r.id?' selected':'')+'>'+that.esc(r.name)+'</option>'}).join('');
    this.modal.content='<h2>'+(id?'Editar':'Nuevo')+' trabajador</h2><div class="field"><label>Nombre</label><input id="wf_name" value="'+this.esc(w?w.name:'')+'"></div><div class="field"><label>Rol</label><select id="wf_role">'+rOpt+'</select></div><div class="field"><label>Notas</label><textarea id="wf_notes">'+this.esc(w?w.notes||'':'')+'</textarea></div><div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="saveWorker('+(id||0)+')">Guardar</button></div>';
    this.modal.show=true;
  },

  saveWorker(id){
    let that=this;
    let body={name:document.getElementById('wf_name').value,role_id:parseInt(document.getElementById('wf_role').value),notes:document.getElementById('wf_notes').value||null};
    let meth=id?'PATCH':'POST';let url=id?'/api/v1/workers/'+id:'/api/v1/workers';
    this.api(url,{method:meth,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(d){
      that.modal.show=false;that.loadWorkers();
      if(!id&&d.data&&d.data.qr_token){
        that.modal.content='<h2>✅ QR Maestro</h2><p class="dim">Guarda este token. <b>No se volverá a mostrar.</b></p><div class="qr-token" id="qr-token-text">'+that.esc(d.data.qr_token)+'</div><div class="actions"><button class="btn btn-p" onclick="navigator.clipboard.writeText(document.getElementById(\'qr-token-text\').textContent)">📋 Copiar</button><button class="btn btn-o" @click="modal.show=false">Cerrar</button></div>';
        that.modal.show=true;
      }else{that.toastOk(id?'Actualizado':'Creado')}
    }).catch(function(e){that.toastErr(e.message)});
  },

  deactivateWorker(id){
    if(!confirm('¿Desactivar trabajador? Su QR dejará de funcionar.'))return;
    let that=this;this.api('/api/v1/workers/'+id,{method:'DELETE'}).then(function(){that.loadWorkers();that.toastOk('Desactivado')}).catch(function(e){that.toastErr(e.message)});
  },

  regenerateWorkerQr(id){
    if(!confirm('¿Regenerar QR? El token anterior será revocado.'))return;
    let that=this;this.api('/api/v1/workers/'+id+'/qr',{method:'POST'}).then(function(d){
      that.modal.content='<h2>🔄 QR Regenerado</h2><p class="dim">El token anterior ha sido revocado.</p><div class="qr-token" id="qr-token-text">'+that.esc(d.data.qr_token)+'</div><div class="actions"><button class="btn btn-p" onclick="navigator.clipboard.writeText(document.getElementById(\'qr-token-text\').textContent)">📋 Copiar</button><button class="btn btn-o" @click="modal.show=false">Cerrar</button></div>';
      that.modal.show=true;that.loadWorkers();
    }).catch(function(e){that.toastErr(e.message)});
  },

  openWorkerDetail(id){
    this.workerDetail=this.workers.find(function(x){return x.id===id});this.workerDetailTab='history';
    let w=this.workerDetail;if(!w)return;
    let that=this;
    this.modal.content='<h2>🧹 '+this.esc(w.name)+' <span style="font-size:12px;color:var(--dim)">'+this.esc((w.role||{}).name||'—')+'</span></h2>'
      +'<div class="tabs"><div class="tab" :class="{act:workerDetailTab===\'history\'}" @click="workerDetailTab=\'history\'">📋 Historial</div><div class="tab" :class="{act:workerDetailTab===\'metrics\'}" @click="workerDetailTab=\'metrics\'">📊 Métricas</div></div>'
      +'<div id="wd-content"><span class="dim">Cargando...</span></div>'
      +'<div class="actions"><button class="btn btn-p btn-sm" @click="regenerateWorkerQr('+w.id+')">🔄 Regenerar QR</button><button class="btn btn-o" @click="modal.show=false">Cerrar</button></div>';
    this.modal.show=true;
    this._loadWorkerDetailTabs(id);
  },

  async _loadWorkerDetailTabs(id){
    let that=this;
    try{
      let d=await this.api('/api/v1/workers/'+id+'/sessions?limit=100');
      let sessions=d.data||[];
      let historyHtml=sessions.length?('<table><tr><th>Habitación</th><th>Entrada</th><th>Salida</th><th>Duración</th><th>Motivo</th></tr>'
        +sessions.map(function(s){return'<tr><td>'+that.esc((s.room||{}).code||'—')+'</td><td style="font-size:11px">'+new Date(s.entered_at+'Z').toLocaleString('es-ES')+'</td><td style="font-size:11px">'+(s.exited_at?new Date(s.exited_at+'Z').toLocaleString('es-ES'):'<span style="color:var(--accent)">Activo</span>')+'</td><td>'+(s.duration_minutes!=null?s.duration_minutes+'m':'—')+'</td><td style="font-size:11px">'+(s.exit_kind||'—')+'</td></tr>'}).join('')+'</table>'):'<p class="dim" style="padding:20px;text-align:center">Sin sesiones registradas</p>';
      let wd=document.getElementById('wd-content');if(wd)wd.innerHTML=historyHtml;
    }catch(e){
      let wd=document.getElementById('wd-content');if(wd)wd.innerHTML='<p class="dim">Error al cargar</p>';
    }
  },

  // ── WORKER ROLES PAGE ──
  workerRolesPage(){
    let that=this;
    return'<div class="ph"><h1>🏷️ Roles de Trabajador</h1><p>'+this.workerRoles.length+' · <button class="btn btn-p btn-sm" @click="openWorkerRoleForm()">+ Nuevo</button></p></div><table><tr><th>Nombre</th><th>Descripción</th><th>Tipos</th><th>Workers</th><th></th></tr>'
      +this.workerRoles.map(function(r){
        return'<tr><td style="font-weight:600">'+that.esc(r.name)+'</td><td style="color:var(--dim)">'+that.esc(r.description||'—')+'</td><td>'+r.room_type_ids.length+'</td><td>'+(r.workers_count||0)+'</td><td style="display:flex;gap:4px"><button class="btn btn-o btn-sm" @click="openWorkerRoleForm('+r.id+')">Editar</button><button class="btn btn-d btn-sm" @click="deleteWorkerRole('+r.id+')" '+((r.workers_count||0)>0?'disabled':'')+'>🗑</button></td></tr>';
      }).join('')+'</table>';
  },

  async openWorkerRoleForm(id){
    let that=this;let r=id?this.workerRoles.find(function(x){return x.id===id}):null;
    await this.loadRoomTypes();
    let rtChecks=this.roomTypes.map(function(t){let checked=r&&r.room_type_ids.includes(t.id)?'checked':'';return'<div><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;margin:4px 0"><input type="checkbox" value="'+t.id+'" '+checked+' class="wrf-rt"> '+that.esc(t.name)+'</label></div>'}).join('');
    this.modal.content='<h2>'+(id?'Editar':'Nuevo')+' rol</h2><div class="field"><label>Nombre</label><input id="wrf_name" value="'+this.esc(r?r.name:'')+'"></div><div class="field"><label>Descripción</label><input id="wrf_desc" value="'+this.esc(r?r.description||'':'')+'"></div><div class="field"><label>Acceso a tipos de habitación</label>'+rtChecks+'</div><div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="saveWorkerRole('+(id||0)+')">Guardar</button></div>';
    this.modal.show=true;
  },

  saveWorkerRole(id){
    let that=this;
    let cbs=document.querySelectorAll('.wrf-rt:checked');let rtIds=[];cbs.forEach(function(c){rtIds.push(parseInt(c.value))});
    let body={name:document.getElementById('wrf_name').value,description:document.getElementById('wrf_desc').value||null,room_type_ids:rtIds};
    let meth=id?'PATCH':'POST';let url=id?'/api/v1/worker-roles/'+id:'/api/v1/worker-roles';
    this.api(url,{method:meth,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(){that.modal.show=false;that.loadWorkerRoles();that.toastOk(id?'Actualizado':'Creado')}).catch(function(e){that.toastErr(e.message)});
  },

  deleteWorkerRole(id){if(!confirm('¿Eliminar rol?'))return;let that=this;this.api('/api/v1/worker-roles/'+id,{method:'DELETE'}).then(function(){that.loadWorkerRoles();that.toastOk('Eliminado')}).catch(function(e){that.toastErr(e.message)})},

  // ═══ Dashboard + rooms + remaining pages (abbreviated — keep original) ═══
  db(){let s=this.stats;return'<div class="ph"><h1>📊 Dashboard</h1><p>Resumen de habitaciones</p></div><div class="sg"><div class="sc"><div class="lb">Total</div><div class="vl">'+s.t+'</div></div><div class="sc"><div class="lb">Libres</div><div class="vl" style="color:var(--success)">'+s.f+'</div></div><div class="sc"><div class="lb">Ocupadas</div><div class="vl" style="color:var(--accent)">'+s.o+'</div></div><div class="sc"><div class="lb">Excedidas</div><div class="vl" style="color:var(--danger)">'+s.ov+'</div></div><div class="sc"><div class="lb">Limpieza</div><div class="vl" style="color:var(--dim)">'+s.cl+'</div></div>'+(this.workersInside.length>0?'<div class="sc"><div class="lb">🧹 Workers Activos</div><div class="vl" style="color:var(--accent)">'+this.workersInside.length+'</div></div>':'')+'</div>';},
  healthPage(){let h=this.health;if(!h)return'<div class="ph"><h1>❤️ Salud del Sistema</h1></div><div class="dim" style="text-align:center;padding:40px">Cargando...</div>';let si=function(s){return s==='running'||s==='connected'||s==='ok'||s==='reachable'?'🟢':s==='warning'?'🟡':'🔴'};let sc2=function(s){return s==='running'||s==='connected'||s==='ok'||s==='reachable'?'var(--green)':s==='warning'?'var(--warning)':'var(--danger)'};let cards='';let dbh=h.checks.database||{};cards+='<div class="sc"><div class="lb">🗄️ Database</div><div class="vl" style="color:'+sc2(dbh.status)+'">'+si(dbh.status)+' '+dbh.status+'</div></div>';cards+='<div class="sc"><div class="lb">🔗 WS-VB6 Bridge</div><div class="vl" style="color:'+sc2(h.checks.ws_vb6)+'">'+si(h.checks.ws_vb6)+' '+h.checks.ws_vb6+'</div></div>';let ts=new Date(h.time).toLocaleString('es-ES');return'<div class="ph"><h1>❤️ Salud del Sistema</h1><p style="color:'+(h.status==='healthy'?'var(--green)':'var(--danger)')+';font-weight:700">'+(h.status==='healthy'?'✅ Sistema saludable':'⚠️ Sistema degradado')+'</p><p class="dim" style="font-size:11px">Última comprobación: '+ts+' · Auto-refresh 15s</p></div><div class="sg" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">'+cards+'</div>';},
  async loadHealth(){try{this.health=await this.api('/api/v1/health/deep')}catch(e){this.health={status:'error',checks:{},time:new Date().toISOString()}}},

  // (remaining pages kept for compatibility — rooms, stays, QRs, etc.)
  roomsPage(){return'<div class="ph"><h1>🚪 Habitaciones</h1><p>'+this.rooms.length+'</p></div><table><tr><th>Nº</th><th>Estado</th><th>Notas</th><th></th></tr>'+this.rooms.map(function(r){return'<tr><td style="font-weight:700">'+this.esc(r.code)+'</td><td>'+this.statusBadge(r.status)+'</td><td>'+this.esc(r.notes||'')+'</td><td><button class="btn btn-o btn-sm" @click="openRoomDetail('+r.id+')">Ver</button></td></tr>'}.bind(this)).join('')+'</table>';},
  openRoomDetail(id){let r=this.rooms.find(function(x){return x.id===id});if(!r)return;let that=this;let devs=[];if(r.pack_id){let pack=this.packs.find(function(p){return p.id===r.pack_id});devs=pack?pack.devices:[]}let html='<h2>🚪 Nº '+this.esc(r.code)+' '+this.statusBadge(r.status)+'</h2>'+'<p>📦 '+(r.pack_id?this.esc(this.packs.find(function(p){return p.id===r.pack_id})?.name||'Pack'):'<span style="color:var(--danger)">Sin pack</span>')+'</p>';
    html+='<h3 style="font-size:14px;margin:12px 0 8px">🧹 Historial de servicio hoy</h3>';
    this.api('/api/v1/workers/1/sessions?room_id='+id+'&limit=20').then(function(d){let s=d.data||[];let sh=s.length?s.map(function(s){return'<div style="padding:4px 0">🕐 '+new Date(s.entered_at+'Z').toLocaleString('es-ES',{hour:'2-digit',minute:'2-digit'})+(s.exited_at?' → '+new Date(s.exited_at+'Z').toLocaleString('es-ES',{hour:'2-digit',minute:'2-digit'}):' (activo)')+' · '+(s.duration_minutes!=null?s.duration_minutes+'m':'—')+'</div>'}).join(''):'<p class="dim">Sin servicio hoy</p>';document.getElementById('wd-service-'+id).innerHTML=sh}).catch(function(){});
    html+='<div id="wd-service-'+id+'"><span class="dim">Cargando...</span></div>';
    html+='<div class="actions"><button class="btn btn-o" @click="modal.show=false">Cerrar</button></div>';
    this.modal.content=html;this.modal.show=true;
  },
  async loadRoomTypes(){try{let d=await this.api('/api/v1/room-types');this.roomTypes=d.items||[]}catch(e){}},
  stayPage(){return'<div class="ph"><h1>⏱️ Estancias</h1></div><table><tr><th>ID</th><th>Hab.</th><th>Estado</th><th></th></tr>'+this.stays.map(function(s){return'<tr><td>'+s.id+'</td><td>'+s.room_id+'</td><td>'+this.statusBadge(s.status)+'</td><td><button class="btn btn-o btn-sm" @click="closeStay('+s.id+')" '+(s.status==='CLOSED'||s.status==='CANCELED'?'disabled':'')+'>Cerrar</button></td></tr>'}.bind(this)).join('')+'</table>';},
  async loadStays(){try{let d=await this.api('/api/v1/stays');this.stays=d.items||[]}catch(e){}},
  closeStay(id){if(!confirm('¿Cerrar?'))return;this.api('/api/v1/stays/'+id+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'checkout'})}).then(()=>{this.loadStays();this.toastOk('Cerrada')}).catch(e=>this.toastErr(e.message))},
  qrPage(){return'<div class="ph"><h1>🎫 QRs</h1></div><table><tr><th>JTI</th><th>Hab.</th><th>Estancia</th></tr>'+this.qrs.map(function(q){return'<tr><td style="font-family:monospace;font-size:11px">'+this.esc((q.jti||'').substring(0,14))+'...</td><td>'+q.room_code+'</td><td>'+q.stay_id+'</td></tr>'}.bind(this)).join('')+'</table>';},
  async loadQrs(){try{let d=await this.api('/api/v1/qr');this.qrs=d.items||[]}catch(e){}},
  debtPage(){return'<div class="ph"><h1>💰 Deudas</h1></div><table><tr><th>ID</th><th>Hab.</th><th>Exceso</th><th>Estado</th></tr>'+this.debts.map(function(d){return'<tr><td>'+d.id+'</td><td>'+d.room_id+'</td><td>'+d.exceso_minutos+'m</td><td>'+d.status+'</td></tr>'}).join('')+'</table>';},
  async loadDebts(){try{let d=await this.api('/api/v1/debts');this.debts=d.items||[]}catch(e){}},
  async loadMonitor(){try{let d=await this.api('/api/v1/admin/access-events?limit=50');this.events=d.items||[]}catch(e){};try{let d=await this.api('/api/v1/admin/outbox');this.outbox=d.items||[]}catch(e){}},
  monitorPage(){return'<div class="ph"><h1>📋 Monitor</h1></div><table><tr><th>Fecha</th><th>Hab.</th><th>Tipo</th><th>Result</th></tr>'+this.events.map(function(e){return'<tr><td style="font-size:11px">'+(e.occurred_at||'').substring(0,16)+'</td><td>'+(e.room_code||e.room_id)+'</td><td>'+(e.kind||'—')+'</td><td>'+(e.result||'—')+'</td></tr>'}).join('')+'</table>';},
  crmUserPage(){return'<div class="ph"><h1>👥 Usuarios</h1></div><table><tr><th>Usuario</th><th>Rol</th><th>Activo</th></tr>'+this.crmUsers.map(function(u){return'<tr><td>'+this.esc(u.username)+'</td><td>'+u.role+'</td><td>'+(u.active?'✅':'❌')+'</td></tr>'}.bind(this)).join('')+'</table>';},
  async loadCrmUsers(){try{let d=await this.api('/api/v1/crm/users');this.crmUsers=d.items||[]}catch(e){}},
  apiClientPage(){return'<div class="ph"><h1>🔑 API Clients</h1></div>';},
  async loadApiClients(){try{let d=await this.api('/api/v1/admin/api-clients');this.apiClients=d.items||[]}catch(e){}},
  async loadAnomalies(){
    let f=this.anomalyFilters;
    let params=[];
    if(f.status&&f.status!=='ALL')params.push('status='+f.status);
    if(f.type)params.push('anomaly_type='+f.type);
    if(f.severity)params.push('severity='+f.severity);
    params.push('limit=100');
    try{let d=await this.api('/api/v1/anomalies?'+params.join('&'));this.anomalies=d.data||[]}catch(e){}
  },
  async loadAnomalySummary(){try{let d=await this.api('/api/v1/anomalies?status=OPEN&limit=200');let items=d.data||[];this.anomalyCount=items.length}catch(e){}},
  async checkAnomalyAlerts(){try{let d=await this.api('/api/v1/anomalies?status=OPEN&limit=200');let items=d.data||[];this.anomalyCount=items.length}catch(e){}},
  roomCodeById(id){let r=this.rooms.find(function(x){return x.id===id});return r?r.code:'#'+id},
  sevBadge(s){return'<span class="badge sev-'+s+'" style="font-size:11px">'+s+'</span>'},
  stBadge(s){let m={OPEN:'Pendiente',ACKNOWLEDGED:'Reconocida',DISMISSED:'Descartada'};return'<span class="badge st-'+s+'" style="font-size:10px">'+(m[s]||s)+'</span>'},
  ANOMALY_CATALOG:[
    {code:'A1',name:'Presencia sin apertura',desc:'PRESENCE sin PROXIMITY=OPEN previo',sev:'HIGH'},
    {code:'A2',name:'Presencia sin estancia',desc:'PRESENCE en room sin stay activo',sev:'HIGH'},
    {code:'A3',name:'Puerta abierta sin QR',desc:'PROXIMITY=OPEN sin QR ni stay OCCUPIED',sev:'CRITICAL'},
    {code:'A4',name:'Presencia sin actividad puerta',desc:'PRESENCE prolongada sin eventos PROXIMITY',sev:'HIGH'},
    {code:'A5',name:'Salida sin apertura',desc:'stay EXITED sin PROXIMITY=OPEN de salida',sev:'MEDIUM'},
    {code:'A6',name:'Presencia post-salida',desc:'PRESENCE tras stay EXITED',sev:'HIGH'},
    {code:'A7',name:'Puerta abierta sin presencia',desc:'door OPEN + absence >120s',sev:'MEDIUM'},
    {code:'A8',name:'Flapping de sensor',desc:'≥5 transiciones mismo sensor en 30s',sev:'LOW'},
  ],
  anomalyPage(){
    let that=this;
    let catTitle='<h3 style="margin:20px 0 8px;font-size:15px">📋 Catálogo de tipos</h3>';
    let catTable='<table class="an-cat-table"><tr><th>Código</th><th>Nombre</th><th>Severidad</th><th>Descripción</th><th>Habilitado</th></tr>'
      +this.ANOMALY_CATALOG.map(function(c){
        let en=that.enabledTypes.indexOf(c.code)>=0;
        return'<tr class="'+(en?'':'disabled')+'"><td class="code">'+c.code+'</td><td>'+c.name+'</td><td>'+that.sevBadge(c.sev)+'</td><td style="font-size:11px;color:var(--dim)">'+c.desc+'</td><td>'+(en?'✅':'❌')+'</td></tr>';
      }).join('')+'</table>';

    let f=this.anomalyFilters;
    let typeOpt='<option value="">Todos los tipos</option>'
      +this.ANOMALY_CATALOG.map(function(c){return'<option value="'+c.code+'"'+((f.type===c.code)?' selected':'')+'>'+c.code+' — '+c.name+'</option>'}).join('');
    let sevOpt='<option value="">Todas las severidades</option>'
      +['CRITICAL','HIGH','MEDIUM','LOW'].map(function(s){return'<option value="'+s+'"'+((f.severity===s)?' selected':'')+'>'+s+'</option>'}).join('');
    let statusOpt='<option value="OPEN"'+(f.status==='OPEN'?' selected':'')+'>📌 Pendientes</option>'
      +'<option value="ACKNOWLEDGED"'+(f.status==='ACKNOWLEDGED'?' selected':'')+'>👁️ Reconocidas</option>'
      +'<option value="DISMISSED"'+(f.status==='DISMISSED'?' selected':'')+'>✅ Histórico</option>'
      +'<option value="ALL"'+(f.status==='ALL'?' selected':'')+'>📋 Todas</option>';
    let filterBar='<div class="fbar">'
      +'<select @change="anomalyFilters.type=$event.target.value;loadAnomalies()">'+typeOpt+'</select>'
      +'<select @change="anomalyFilters.severity=$event.target.value;loadAnomalies()">'+sevOpt+'</select>'
      +'<select @change="anomalyFilters.status=$event.target.value;loadAnomalies()">'+statusOpt+'</select>'
      +'<span class="dim" style="font-size:12px">'+this.anomalies.length+' resultados</span></div>';

    let hdrMap={OPEN:'Pendientes',ACKNOWLEDGED:'Reconocidas',DISMISSED:'Histórico',ALL:'Todas'};
    let header='<div class="ph"><h1>⚠️ Anomalías — '+(hdrMap[f.status]||'Todas')+'</h1><p>'+this.anomalies.length+' mostradas'+(this.anomalyCount>0?' · '+this.anomalyCount+' pendientes':'')+'</p></div>';

    let emptyMsg=f.status==='OPEN'?'Sin anomalías pendientes 🎉':(f.status==='ACKNOWLEDGED'?'Sin anomalías reconocidas':'Sin anomalías en esta vista');
    let table=this.anomalies.length===0
      ?'<p class="dim" style="text-align:center;padding:30px">'+emptyMsg+'</p>'
      :'<table><tr><th>ID</th><th>Hab.</th><th>Tipo</th><th>Severidad</th><th>Estado</th><th>Detectada</th><th></th></tr>'
      +this.anomalies.map(function(a){
        let code=a.room_code||that.roomCodeById(a.room_id);
        let det=a.detected_at?a.detected_at.substring(0,16).replace('T',' '):'—';
        let action='';
        if(a.status==='OPEN'){
          action='<button @click="acknowledgeAnomaly('+a.id+')" class="btn btn-p btn-xs" style="margin-right:4px">✓</button>'
                +'<button @click="dismissAnomaly('+a.id+')" class="btn btn-d btn-xs">🗑</button>';
        }else if(a.status==='ACKNOWLEDGED'){
          action='<span class="dim" style="font-size:10px">por '+(a.acknowledged_by||'—')+'<br>'+det+'</span>';
        }else{
          action='<span class="dim" style="font-size:10px">auto<br>'+det+'</span>';
        }
        return'<tr><td style="font-family:monospace;font-size:11px">#'+a.id+'</td>'
          +'<td style="font-weight:600">'+code+'</td>'
          +'<td title="'+((that.ANOMALY_CATALOG.find(function(c){return c.code===a.anomaly_type})||{}).desc||'')+'">'+a.anomaly_type+'</td>'
          +'<td>'+that.sevBadge(a.severity)+'</td>'
          +'<td>'+that.stBadge(a.status)+'</td>'
          +'<td style="font-size:11px;color:var(--dim)">'+det+'</td>'
          +'<td style="white-space:nowrap">'+action+'</td></tr>';
      }).join('')+'</table>';

    return header+filterBar+catTitle+catTable+'<h3 style="margin:20px 0 8px;font-size:15px">🔍 Anomalías detectadas</h3>'+table;
  },
  async acknowledgeAnomaly(id){
    let that=this;
    try{await this.api('/api/v1/anomalies/'+id+'/acknowledge',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    that.toastOk('Anomalía #'+id+' reconocida');that.loadAnomalies();that.loadAnomalySummary()}catch(e){that.toastErr(e.message)}
  },
  async dismissAnomaly(id){
    if(!confirm('¿Descartar anomalía #'+id+'?'))return;
    let that=this;
    try{await this.api('/api/v1/anomalies/'+id+'/dismiss',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    that.toastOk('Anomalía #'+id+' descartada');that.loadAnomalies();that.loadAnomalySummary()}catch(e){that.toastErr(e.message)}
  },
  async loadEnabledTypes(){
    try{let d=await this.api('/api/v1/admin/settings?service=api');
    let g=(d.settings||{}).anomaly||[];
    let s=g.find(function(x){return x.key==='anomaly.enabled_types'});
    if(s&&s.value){let v=JSON.parse(s.value);if(Array.isArray(v))this.enabledTypes=v}}
    catch(e){}
  },
  devPage(){return'<div class="ph"><h1>🔌 Dispositivos</h1></div>';},
  async loadDevices(){},
  packPage(){return'<div class="ph"><h1>📦 Packs</h1><p>'+this.packs.length+'</p></div>';},
  settingsPage(){return'<div class="ph"><h1>⚙️ Configuración</h1></div>';},
  async loadSettings(){},
  async loadDeviceStatus(){}
}};
</script>
</body>
</html>
