<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cerraduras — Panel CRM</title>
<script src="/assets/qrcode.min.js"></script>
<script src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e1e4eb;--dim:#8b8fa3;--accent:#6c8ee0;--danger:#e0556a;--success:#4caf93;--warning:#e0b94e;--sw:240px;--nopack-bg:rgba(224,85,106,.08);--font-ui:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;--k-rpi:#e6b85c;--k-lock:#5ec2cf;--k-prox:#62c99b;--k-pres:#e0904f;--k-sw:#7d9ce8;--k-scan:#a8b2c3;--k-rpi-bg:rgba(230,184,92,.12);--k-lock-bg:rgba(94,194,207,.12);--k-prox-bg:rgba(98,201,155,.12);--k-pres-bg:rgba(224,144,79,.12);--k-sw-bg:rgba(125,156,232,.12);--k-scan-bg:rgba(168,178,195,.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.mono{font-family:var(--font-mono);letter-spacing:.2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10}
.sidebar-header{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
.sidebar-header h2{font-size:18px}.sidebar-header .ui{font-size:12px;color:var(--dim);margin-top:4px}
.sidebar nav{flex:1}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--dim);text-decoration:none;font-size:14px;transition:all .15s;cursor:pointer}
.sidebar nav a:hover{background:rgba(108,142,224,.1);color:var(--text)}
.sidebar nav a.active{color:var(--accent);background:rgba(108,142,224,.15);border-right:3px solid var(--accent)}
.sidebar nav a .ic{font-size:18px;width:22px;text-align:center}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border)}
.sidebar-footer button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px}
.sidebar-footer button:hover{color:var(--danger)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.main{flex:1;padding:24px 32px;overflow-y:auto;max-width:1500px}
.ph{margin-bottom:20px}.ph h1{font-size:22px;font-weight:700}.ph p{color:var(--dim);font-size:13px;margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.sc .lb{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.sc .vl{font-size:26px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 10px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;font-size:13px;border-bottom:1px solid rgba(42,45,58,.5)}
tr:hover td{background:rgba(108,142,224,.05)}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600;transition:opacity .15s;text-decoration:none;display:inline-block}
.btn:hover{opacity:.85}.btn-p{background:var(--accent);color:#fff}.btn-d{background:var(--danger);color:#fff}.btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:11px}.btn-xs{padding:3px 7px;font-size:10px}
.fbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.fbar input,.fbar select,.fbar button{padding:7px 12px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:90%;max-width:580px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px}.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:13px;z-index:200;animation:slideUp .3s}
.toast-ok{background:var(--success);color:#000}.toast-err{background:var(--danger);color:#fff}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.tooltip{position:relative;display:inline-block;margin-left:4px;cursor:help;color:var(--accent);font-weight:700;font-size:13px}
.tooltip .tip{display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:11px;color:var(--text);white-space:normal;width:280px;z-index:200;line-height:1.4;font-weight:400;text-align:left}
.tooltip:hover .tip{display:block}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}.tab.act{color:var(--accent);border-bottom-color:var(--accent)}.dim{color:var(--dim);font-size:12px}
.sidebar-badge{background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:auto;min-width:18px;text-align:center}
/* anomaly badges */
.sv-CRITICAL{background:rgba(224,85,106,.25);color:#e0556a;font-weight:700}
.sv-HIGH{background:rgba(224,85,106,.12);color:var(--danger)}
.sv-MEDIUM{background:rgba(224,185,78,.15);color:var(--warning)}
.sv-LOW{background:rgba(139,143,163,.12);color:var(--dim)}
.st-OPEN{background:rgba(224,85,106,.22);color:#f06070;font-weight:600}
.st-ACKNOWLEDGED{background:rgba(224,185,78,.18);color:var(--warning)}
.st-DISMISSED{background:rgba(76,175,147,.15);color:var(--success)}
.an-cat-table{font-size:12px;margin-bottom:20px}
.an-cat-table th{font-size:10px}
.an-cat-table .disabled{opacity:.35}
.an-cat-table .code{font-family:monospace;font-weight:700}
/* F38: QR token display */
.qr-token{font-family:monospace;font-size:10px;word-break:break-all;background:var(--bg);padding:10px;border-radius:6px;border:1px solid var(--accent);margin:10px 0;max-height:80px;overflow-y:auto;line-height:1.4;color:var(--accent)}
/* ── Packs y Dispositivos (F25-UI) ───────────── */
.fbar .grow{flex:1;min-width:220px}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.legend-item{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.legend-item i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.packs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pack-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,transform .2s;animation:cardIn .45s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*60ms)}
.pack-card:hover{border-color:#3a3f52;transform:translateY(-2px)}
.pack-head{display:flex;align-items:flex-start;gap:10px}
.pack-id{flex:1;min-width:0}
.pack-code{font-family:var(--font-mono);font-size:11px;color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:2px 7px;display:inline-block}
.pack-name{font-size:15px;font-weight:600;margin-top:6px}
.room-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--accent);background:rgba(108,142,224,.13);border:1px solid rgba(108,142,224,.35);border-radius:20px;padding:3px 10px;white-space:nowrap;flex:none}
.room-pill--none{color:var(--warning);background:rgba(224,185,78,.1);border:1px dashed rgba(224,185,78,.5)}
.tchip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.5px;color:var(--tc);background:var(--tcbg);border:1px solid color-mix(in srgb,var(--tc) 32%,transparent);border-radius:4px;padding:2px 6px;white-space:nowrap;flex:none}
.pchip{display:inline-flex;align-items:center;font-size:10px;font-weight:600;color:var(--pc);background:var(--pcbg);border:1px solid color-mix(in srgb,var(--pc) 30%,transparent);border-radius:10px;padding:2px 8px;white-space:nowrap;flex:none}
.pack-sig{display:flex;gap:4px;height:14px;align-items:flex-end;padding:0 2px;animation:sigIn .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*60ms + 80ms)}
.pack-sig i{width:4px;border-radius:1px;height:12px;opacity:.9}
.pack-sig i:first-child{height:7px}.pack-sig i:last-child{height:9px}
.pack-devs{list-style:none;display:flex;flex-direction:column;gap:2px;margin:0;padding:0}
.pdev{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;border:1px solid transparent;transition:background .15s}
.pdev:hover{background:rgba(108,142,224,.06)}
.pdev-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--c);background:var(--c-bg,rgba(139,143,163,.12));flex:none}
.pdev-ic svg{width:16px;height:16px}
.pdev-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pdev-lb{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdev-id{font-size:10.5px;color:var(--dim)}
.kchip{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.6px;color:var(--c);background:var(--c-bg);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-radius:4px;padding:2px 6px;white-space:nowrap;flex:none}
.pdev--empty{padding:14px 8px;text-align:center;color:var(--dim);font-size:12px;border:1px dashed var(--border);border-radius:8px}
.pack-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding-top:10px;font-size:11px}
.pack-foot .mono{color:var(--dim)}
.pack-acts{margin-left:auto;display:flex;gap:6px}
.kind-pills{display:flex;gap:6px;flex-wrap:wrap}
.kind-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--dim);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.kind-pill:hover{color:var(--text);border-color:#3a3f52}
.kind-pill.act{color:var(--c,var(--accent));border-color:var(--c,var(--accent));background:var(--c-bg,rgba(108,142,224,.12))}
.kind-pill .mono{font-size:10px}
.dv-group{margin-bottom:26px;animation:cardIn .4s cubic-bezier(.16,1,.3,1) both}
.dv-group-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dv-dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px rgba(108,142,224,.18)}
.dv-group-head h2{font-size:15px;font-weight:600}
.dv-count{color:var(--dim);font-size:11px}
.dv-bus{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:22px}
.dv-bus::before{content:'';position:absolute;left:9px;top:2px;bottom:2px;width:1px;background:linear-gradient(180deg,var(--border),rgba(42,45,58,.2));animation:railIn .6s cubic-bezier(.16,1,.3,1) both}
.dv-group--bare .dv-bus::before{border-left:1px dashed var(--border);background:none}
.dv-card{display:flex;gap:14px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;align-items:flex-start;position:relative;animation:cardIn .4s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*45ms);transition:border-color .2s,transform .2s}
.dv-card:hover{border-color:#3a3f52;transform:translateY(-1px)}
.dv-glyph{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:var(--c-bg);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.dv-glyph svg{width:22px;height:22px}
.dv-body{flex:1;min-width:0}
.dv-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;flex-wrap:wrap}
.dv-id{font-size:10.5px;color:var(--dim);margin-top:3px}
.dv-specs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.spec-chip{font-size:10.5px;color:var(--dim);background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:2px 7px}
.spec-chip b{color:var(--text);font-weight:600}
.spec-chip--bare{border-style:dashed;font-style:italic}
.dv-side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.dv-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.dv-card:hover .dv-acts,.dv-card:focus-within .dv-acts{opacity:1}
.icon-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--dim);transition:all .15s}
.icon-btn:hover{color:var(--text);border-color:#3a3f52}
.icon-btn--danger:hover{color:var(--danger);border-color:var(--danger)}
.icon-btn svg{width:14px;height:14px}
.batt{display:inline-flex;align-items:center;gap:6px;flex:none}
.batt svg{width:12px;height:12px;color:var(--dim)}
.batt-track{width:34px;height:4px;border-radius:2px;background:var(--border);overflow:hidden;display:inline-block}
.batt-track b{display:block;height:100%;border-radius:2px;background:var(--dim);transition:width .4s cubic-bezier(.16,1,.3,1)}
.batt em{font-style:normal;font-size:10.5px;color:var(--dim)}
.batt--ok svg{color:var(--success)}.batt--ok .batt-track b{background:var(--success)}
.batt--low svg{color:var(--warning)}.batt--low .batt-track b{background:var(--warning)}
.batt--low svg,.batt--crit svg{animation:pulse 2s ease-in-out infinite}
.batt--crit svg{color:var(--danger)}.batt--crit .batt-track b{background:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:64px 20px;border:1px dashed var(--border);border-radius:14px;color:var(--dim);animation:cardIn .4s both}
.empty-glyph{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px;color:var(--dim);background:var(--card);border:1px solid var(--border)}
.empty-glyph svg{width:28px;height:28px}
.empty h2{font-size:16px;color:var(--text);font-weight:600}
.empty p{font-size:13px;max-width:42ch}
.field--mono input{font-family:var(--font-mono);font-size:13px}
.field-hint{font-size:11px;color:var(--dim);margin-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--dim);background:var(--bg);border:1px solid var(--border);font-family:var(--font-mono);transition:all .15s}
.seg-btn:hover{color:var(--text)}
.seg-btn.act{color:var(--c);border-color:var(--c);background:var(--c-bg,rgba(108,142,224,.12))}
.seg-btn[disabled]{opacity:.4;cursor:not-allowed}
.dev-picker{max-height:230px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:6px;display:flex;flex-direction:column;gap:2px}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .15s;background:none;border:none;color:var(--text);text-align:left;width:100%;font-size:12.5px}
.chk-row:hover{background:rgba(108,142,224,.06)}
.chk-row input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex:none}
.chk-txt{flex:1;display:flex;flex-direction:column;font-size:12.5px;min-width:0}
.chk-txt .mono{font-size:10.5px}
.chk-cur{font-size:10px}
.chk-row--add{justify-content:flex-start;border:1px dashed var(--border);margin-top:4px;color:var(--accent)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes sigIn{from{opacity:0;transform:scaleX(.5);transform-origin:left}to{opacity:1;transform:scaleX(1)}}
@keyframes railIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn:active,.seg-btn:active,.kind-pill:active,.icon-btn:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:560px){.dv-card{flex-wrap:wrap}.dv-side{margin-left:0;align-items:flex-start;flex-direction:row;width:100%;justify-content:space-between}.dv-bus{padding-left:0}.dv-bus::before{display:none}}
</style>
</head>
<body x-data="crm()" x-init="init()">
<aside class="sidebar">
  <div class="sidebar-header"><h2>🔐 Cerraduras</h2><div class="ui" x-text="user?.display_name||user?.username||'...'"></div></div>
  <nav>
    <a :class="{active:p==='db'}" role="button" tabindex="0" @click="nav('db')" @keydown.enter="nav('db')" @keydown.space.prevent="nav('db')"><span class="ic">📊</span>Dashboard</a>
    <a :class="{active:p==='ro'}" role="button" tabindex="0" @click="nav('ro')" @keydown.enter="nav('ro')" @keydown.space.prevent="nav('ro')"><span class="ic">🚪</span>Habitaciones</a>
    <a :class="{active:p==='pk'}" role="button" tabindex="0" @click="nav('pk')" @keydown.enter="nav('pk')" @keydown.space.prevent="nav('pk')"><span class="ic">📦</span>Packs</a>
    <a :class="{active:p==='dv'}" role="button" tabindex="0" @click="nav('dv')" @keydown.enter="nav('dv')" @keydown.space.prevent="nav('dv')"><span class="ic">🔌</span>Dispositivos</a>
    <a :class="{active:p==='st'}" role="button" tabindex="0" @click="nav('st')" @keydown.enter="nav('st')" @keydown.space.prevent="nav('st')"><span class="ic">⏱️</span>Estancias</a>
    <a :class="{active:p==='qr'}" role="button" tabindex="0" @click="nav('qr')" @keydown.enter="nav('qr')" @keydown.space.prevent="nav('qr')"><span class="ic">🎫</span>QRs</a>
    <a :class="{active:p==='dbts'}" role="button" tabindex="0" @click="nav('dbts')" @keydown.enter="nav('dbts')" @keydown.space.prevent="nav('dbts')"><span class="ic">💰</span>Deudas</a>
     <a :class="{active:p==='w'}" role="button" tabindex="0" @click="nav('w')" @keydown.enter="nav('w')" @keydown.space.prevent="nav('w')"><span class="ic">🧹</span>Trabajadores<span x-show="workerAlertCount>0" class="sidebar-badge" x-text="workerAlertCount"></span></a>
     <a :class="{active:p==='ky'}" role="button" tabindex="0" @click="nav('ky')" @keydown.enter="nav('ky')" @keydown.space.prevent="nav('ky')"><span class="ic">🔑</span>Llaves</a>
     <a :class="{active:p==='nc'}" role="button" tabindex="0" @click="nav('nc')" @keydown.enter="nav('nc')" @keydown.space.prevent="nav('nc')"><span class="ic">💳</span>Fichas NFC</a>
     <a :class="{active:p==='ac'}" role="button" tabindex="0" @click="nav('ac')" @keydown.enter="nav('ac')" @keydown.space.prevent="nav('ac')"><span class="ic">📜</span>Accesos</a>
     <a :class="{active:p==='fd'}" role="button" tabindex="0" @click="nav('fd')" @keydown.enter="nav('fd')" @keydown.space.prevent="nav('fd')"><span class="ic">🏭</span>Fábrica</a>
    <a :class="{active:p==='wr'}" role="button" tabindex="0" @click="nav('wr')" @keydown.enter="nav('wr')" @keydown.space.prevent="nav('wr')"><span class="ic">🏷️</span>Roles</a>
    <a :class="{active:p==='mon'}" role="button" tabindex="0" @click="nav('mon')" @keydown.enter="nav('mon')" @keydown.space.prevent="nav('mon')"><span class="ic">📋</span>Monitor</a>
    <a :class="{active:p==='us'}" role="button" tabindex="0" @click="nav('us')" @keydown.enter="nav('us')" @keydown.space.prevent="nav('us')"><span class="ic">👥</span>Usuarios</a>
    <a :class="{active:p==='cl'}" role="button" tabindex="0" @click="nav('cl')" @keydown.enter="nav('cl')" @keydown.space.prevent="nav('cl')"><span class="ic">🔑</span>API Clients</a>
    <a :class="{active:p==='an'}" role="button" tabindex="0" @click="nav('an')" @keydown.enter="nav('an')" @keydown.space.prevent="nav('an')"><span class="ic">⚠️</span>Anomalías<span x-show="anomalyCount>0" class="sidebar-badge" x-text="anomalyCount"></span></a>
    <a :class="{active:p==='he'}" role="button" tabindex="0" @click="nav('he')" @keydown.enter="nav('he')" @keydown.space.prevent="nav('he')"><span class="ic">❤️</span>Salud</a>
    <a :class="{active:p==='cfg'}" role="button" tabindex="0" @click="nav('cfg')" @keydown.enter="nav('cfg')" @keydown.space.prevent="nav('cfg')"><span class="ic">⚙️</span>Configuración</a>
  </nav>
  <div class="sidebar-footer"><button @click="logout">Cerrar sesión</button></div>
</aside>
<main class="main"><div x-html="render() || ''"></div></main>
<div x-show="toast.show" class="toast" role="status" aria-live="polite" :class="'toast-'+toast.type" x-text="toast.msg || ''" @click="toast.show=false" style="cursor:pointer"></div>
<div x-show="modal.show" class="modal-overlay" @click.self="modal.show=false" @keydown.escape.window="modal.show=false"><div class="modal" role="dialog" aria-modal="true" aria-label="Diálogo del panel" tabindex="-1"><div x-html="modal.content"></div></div></div>

<script>
function crm(){return{
  user:null,p:'db',rooms:[],roomTypes:[],packs:[],stays:[],qrs:[],debts:[],events:[],pEvents:[],outbox:[],crmUsers:[],apiClients:[],anomalies:[],anomalySummary:{},anomalyCount:0,enabledTypes:['A1','A2','A3','A4','A5','A6','A7','A8'],anomalyFilters:{status:'OPEN',type:'',severity:''},newAnomalies:[],bannerDismissed:false,_seenAnomalyIds:new Set(),cfgSettings:{},
   workers:[],workerRoles:[],workersInside:[],factoryDevices:[],workerAlerts:[],workerAlertCount:0,workerTab:'list',workerDetail:null,workerDetailTab:'history',workerAlertSettings:{excessiveMin:120,strangeStart:7,strangeEnd:22},
   accessKeys:[],nfcCards:[],keyAccesses:[],keyFilters:{worker_id:'',status:'',q:''},nfcFilter:{status:'',q:''},accessFilters:{worker_id:'',key_id:'',result:'',from:'',to:''},_lastKeyToken:null,
  toast:{show:false,msg:'',type:'ok'},modal:{show:false,content:''},
  stats:{t:0,f:0,o:0,ov:0,cl:0},monTab:'rooms',cfgTab:'operation',health:null,_healthTimer:null,_factoryTimer:null,
  deviceStatus:{},deviceStatusTick:0,fwOps:{},fwReleases:[],_fwTimer:null,
  devices:[],pkQ:'',devQ:'',devKind:'ALL',pkForm:{name:'',code:''},pkSel:[],devForm:{kind:'RPI',subtype:'CERRADURA',external_id:'',label:'',pack_id:null,transport:'UNKNOWN',meta:{}},roomForm:{code:'',room_type_id:null,notes:'',pack_id:null},

  async init(){try{let r=await fetch('/api/v1/crm/me');if(!r.ok){window.location.href='/panel/login';return}this.user=(await r.json()).user;await Promise.all([this.loadDashboard(),this.loadPacks()]);await this.loadFirmwareOps();this._fwTimer=setInterval(()=>{this.refreshFirmwareOps();this.checkAnomalyAlerts();this.computeWorkerAlerts()},5000)}catch(e){window.location.href='/panel/login'}},
  async api(url,opts={}){let r=await fetch(url,opts);if(!r.ok){let d=await r.json().catch(()=>({}));let e=new Error(d.error?.message||('Error '+r.status));e.code=d.error?.code||null;e.status=r.status;throw e}return r.json()},
  async loadDashboard(){try{let d=await this.api('/api/v1/rooms');this.rooms=d.items||[];this.stats={t:this.rooms.length,f:this.rooms.filter(function(r){return r.status==='FREE'}).length,o:this.rooms.filter(function(r){return r.status==='OCCUPIED'}).length,ov:this.rooms.filter(function(r){return r.status==='OVERSTAY'}).length,cl:this.rooms.filter(function(r){return r.status==='CLEANING'}).length};this.loadAnomalySummary()}catch(e){}},
  async loadPacks(){try{let d=await this.api('/api/v1/device-packs');this.packs=d.items||[];this.deriveDevices()}catch(e){this.toastErr('Error cargando packs: '+e.message)}},
   nav(p){this.p=p;this.modal.show=false;if(this._healthTimer){clearInterval(this._healthTimer);this._healthTimer=null}if(this._factoryTimer){clearInterval(this._factoryTimer);this._factoryTimer=null}if(p==='ro'){this.monTab='rooms';this.loadRoomTypes();this.loadDeviceStatus()}if(p==='dv')this.loadDevices();if(p==='pk')this.loadPacks();if(p==='st')this.loadStays();if(p==='qr')this.loadQrs();if(p==='dbts')this.loadDebts();if(p==='w')this.loadWorkers();if(p==='ky'){this.loadWorkers();this.loadWorkerRoles();this.loadRoomTypes();this.loadKeys()}if(p==='nc'){this.loadNfcCards()}if(p==='ac'){this.loadWorkers();this.loadAccessKeysForFilter();this.loadKeyAccesses()}if(p==='fd'){this.loadFactoryDevices();this._factoryTimer=setInterval(()=>this.loadFactoryDevices(true),5000)}if(p==='wr')this.loadWorkerRoles();if(p==='mon')this.loadMonitor();if(p==='us')this.loadCrmUsers();if(p==='cl')this.loadApiClients();if(p==='an'){this.loadAnomalies();this.loadEnabledTypes()}if(p==='db'){this.loadDashboard();this.loadAnomalySummary()}if(p==='he'){this.loadHealth();this._healthTimer=setInterval(function(){this.loadHealth()}.bind(this),15000)}if(p==='cfg')this.loadSettings()},
  toastOk(m){this.toast={show:true,msg:m,type:'ok'};setTimeout(()=>this.toast.show=false,3000)},
  toastErr(m){this.toast={show:true,msg:m,type:'err'};setTimeout(()=>this.toast.show=false,4000)},
  async logout(){await fetch('/api/v1/crm/logout',{method:'POST'});window.location.href='/panel/login'},
  esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')},
  statusBadge(s){let m={FREE:'Libre',OCCUPIED:'Ocupada',RESERVED:'Reservada',OVERSTAY:'Excedida',EXITED:'Salida',CLEANING:'Limpieza',OUT_OF_SERVICE:'F.Servicio',CLOSED:'Cerrada',CANCELED:'Cancelada'};return'<span class="badge" style="background:'+(s==='FREE'?'rgba(76,175,147,.2)':s==='OCCUPIED'?'rgba(108,142,224,.2)':s==='RESERVED'?'rgba(224,185,78,.2)':s==='OVERSTAY'?'rgba(224,85,106,.2)':'rgba(139,143,163,.2)')+';color:'+(s==='FREE'?'var(--success)':s==='OCCUPIED'?'var(--accent)':s==='RESERVED'?'var(--warning)':s==='OVERSTAY'?'var(--danger)':'var(--dim)')+';font-size:10px">'+(m[s]||s||'Desconocido')+'</span>'},
  tooltip(text){return'<span class="tooltip">?<span class="tip">'+text+'</span></span>'},

  // ═══ Worker methods (F38) ═══
  async loadWorkers(){try{let d=await this.api('/api/v1/workers');this.workers=d.data||[];this.computeWorkerAlerts()}catch(e){}},
  async loadWorkerRoles(){try{let d=await this.api('/api/v1/worker-roles');this.workerRoles=d.data||[]}catch(e){}},
  async loadWorkersInside(){try{let d=await this.api('/api/v1/workers/inside');this.workersInside=d.data||[]}catch(e){}},
  async computeWorkerAlerts(){
    try{let d=await this.api('/api/v1/workers/inside');this.workersInside=d.data||[]}catch(e){return}
    let alerts=[];let s=this.workerAlertSettings;
    for(let wi of this.workersInside){
      let dur=wi.duration_minutes||0;
      if(dur>s.excessiveMin)alerts.push({type:'excessive_time',msg:'⏱ '+this.esc(wi.worker.name)+' lleva '+dur+' min en '+this.esc(wi.room.code),worker:wi});
      let h=new Date(wi.entered_at+'Z').getUTCHours();
      if(h<s.strangeStart||h>=s.strangeEnd)alerts.push({type:'strange_hour',msg:'🌙 '+this.esc(wi.worker.name)+' entró a '+this.esc(wi.room.code)+' a las '+h.toString().padStart(2,'0')+':00',worker:wi});
    }
    this.workerAlerts=alerts;this.workerAlertCount=alerts.length;
  },

   render(){switch(this.p){case'db':return this.db();case'ro':return this.roomsPage();case'dv':return this.devPage();case'pk':return this.packPage();case'st':return this.stayPage();case'qr':return this.qrPage();case'dbts':return this.debtPage();case'w':return this.workersPage();case'ky':return this.keysPage();case'nc':return this.nfcPage();case'ac':return this.accessesPage();case'fd':return this.factoryPage();case'wr':return this.workerRolesPage();case'mon':return this.monitorPage();case'us':return this.crmUserPage();case'cl':return this.apiClientPage();case'an':return this.anomalyPage();case'he':return this.healthPage();case'cfg':return this.settingsPage();default:return this.db()}},

     async loadFactoryDevices(silent){try{let d=await this.api('/api/v1/factory-devices?status=ALL');this.factoryDevices=d.data||[]}catch(e){if(!silent)this.toastErr(e.message)}},
       openFactoryClaim(id){let d=this.factoryDevices.find(function(x){return x.id===id}),that=this,packs=this.packs.map(function(p){return'<option value="'+p.id+'">'+that.esc(p.code||p.name||('Pack '+p.id))+'</option>'}).join('');this.modal.content='<h2>Reclamar equipo</h2><div class="field field--mono"><label>chip_id (informativo)</label><code>'+that.esc(d?.chip_id||'')+'</code></div><div class="field"><label>Variante del ESP</label><select id="fc_subtype"><option value="CERRADURA">ESP-cerradura</option><option value="IMAN">ESP-imán</option></select><p class="field-hint">Debe coincidir con el sketch que se cargará en la placa.</p></div><div class="field"><label>Etiqueta (opcional)</label><input id="fc_label"></div><div class="field"><label>Pack (opcional)</label><select id="fc_pack"><option value="">Sin pack</option>'+packs+'</select></div><p class="field-hint">La credencial individual permanece protegida en el dispositivo y no se solicita al operador.</p><div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="claimFactoryDevice('+id+')">Reclamar</button></div>';this.modal.show=true},
       async claimFactoryDevice(id){if(!document.getElementById('fc_label')){this.openFactoryClaim(id);return}let label=document.getElementById('fc_label')?.value||'',pack=document.getElementById('fc_pack')?.value||'',subtype=document.getElementById('fc_subtype')?.value||'CERRADURA';try{await this.api('/api/v1/factory-devices/'+id+'/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:label||null,pack_id:pack?parseInt(pack):null,subtype:subtype})});this.modal.show=false;this.modal.content='';this.toastOk('Equipo reclamado');await this.loadFactoryDevices();await this.loadPacks()}catch(e){this.toastErr(e.message)}},
    factoryPage(){let that=this;return'<div class="ph"><h1>🏭 Identificación de fábrica</h1><p>Equipos anunciados antes del montaje · '+this.factoryDevices.length+'</p></div><table><tr><th>chip_id</th><th>Estado</th><th>Dispositivo</th><th>Primer anuncio</th><th>Último anuncio</th><th></th></tr>'+this.factoryDevices.map(function(d){return'<tr><td><code>'+that.esc(d.chip_id)+'</code></td><td>'+that.statusBadge(d.status)+'</td><td>'+(d.device_id?'<code>RPI #'+d.device_id+'</code>':'<span class="dim">—</span>')+'</td><td>'+that.esc(d.first_announced_at)+'</td><td>'+that.esc(d.last_announced_at)+'</td><td>'+(d.status==='PENDING'?'<button class="btn btn-p btn-sm" @click="claimFactoryDevice('+d.id+')">Reclamar</button>':(d.device_id?'<button class="btn btn-o btn-sm" @click="nav(\'dv\')">Asignar pack</button>':'<span class="dim">Reclamado por '+that.esc(d.claimed_by||'—')+'</span>'))+'</td></tr>'}).join('')+'</table>'},


  // ═══ F96: Llaves de acceso, fichas NFC y auditoría ═══
  async loadKeys(){try{let p=new URLSearchParams();if(this.keyFilters.worker_id)p.set('worker_id',this.keyFilters.worker_id);if(this.keyFilters.status)p.set('status',this.keyFilters.status);if(this.keyFilters.q)p.set('q',this.keyFilters.q);let d=await this.api('/api/v1/keys'+(p.toString()?'?'+p:''));this.accessKeys=d.data||[]}catch(e){this.toastErr(e.message)}},
  async loadAccessKeysForFilter(){try{let d=await this.api('/api/v1/keys');this.accessKeys=d.data||[]}catch(e){}},
  async loadNfcCards(){try{let p=new URLSearchParams();if(this.nfcFilter.status)p.set('status',this.nfcFilter.status);if(this.nfcFilter.q)p.set('q',this.nfcFilter.q);let d=await this.api('/api/v1/nfc-cards'+(p.toString()?'?'+p:''));this.nfcCards=d.data||[]}catch(e){this.toastErr(e.message)}},
  async loadKeyAccesses(){try{let p=new URLSearchParams();let f=this.accessFilters;['worker_id','key_id','result','from','to'].forEach(k=>{if(f[k])p.set(k,f[k])});let d=await this.api('/api/v1/keys/accesses'+(p.toString()?'?'+p:''));this.keyAccesses=d.data||[]}catch(e){this.toastErr(e.message)}},
  fmtKeyDate(v){if(!v)return '—';try{return new Date(String(v).replace(' ','T')+'Z').toLocaleString('es-ES')}catch(e){return v}},
  keyOwner(k){return k.owner_type==='WORKER'?'👤 '+(k.worker_name||('Trabajador #'+k.worker_id)):'🏷️ Rol: '+(k.role_name||('#'+k.role_id))},
  keyStatusBadge(k){let s=k.effective_status||k.status;let m={ACTIVE:['Activa','rgba(76,175,147,.2)','var(--success)'],EXPIRED:['Caducada','rgba(224,185,78,.2)','var(--warning)'],REVOKED:['Revocada','rgba(224,85,106,.2)','var(--danger)']};let x=m[s]||[s,'rgba(139,143,163,.2)','var(--dim)'];return '<span class="badge" style="background:'+x[1]+';color:'+x[2]+'">'+x[0]+'</span>'},
  keyPerms(k){return k.all_room_types?'Todos los tipos':((k.room_type_ids||[]).length+' tipo(s)')},
  keysPage(){let that=this;let f=this.keyFilters;
    return '<div class="ph"><h1>🔑 Llaves</h1><p>Llaves QR y fichas con validez y permisos por tipo de sala · <button class="btn btn-p btn-sm" @click="openKeyForm()">+ Nueva llave</button></p></div>'
      +'<div class="fbar"><input placeholder="Buscar etiqueta, titular, ficha…" value="'+this.esc(f.q||'')+'" oninput="this.dataset.v=this.value" @keydown.enter="setKeyFilter(\'q\',$event.target.value)"><select @change="setKeyFilter(\'status\',$event.target.value)"><option value="">Todos los estados</option><option value="ACTIVE"'+(f.status==='ACTIVE'?' selected':'')+'>Activas</option><option value="EXPIRED"'+(f.status==='EXPIRED'?' selected':'')+'>Caducadas</option><option value="REVOKED"'+(f.status==='REVOKED'?' selected':'')+'>Revocadas</option></select>'+(f.worker_id?'<button class="btn btn-o btn-sm" @click="clearKeyFilters()">Quitar filtro trabajador</button>':'')+'</div>'
      +'<table><tr><th>Etiqueta</th><th>Titular</th><th>Tipo</th><th>Validez</th><th>Permisos</th><th>Estado</th><th></th></tr>'
      +this.accessKeys.map(function(k){return '<tr><td style="font-weight:600">'+that.esc(k.label)+'</td><td>'+that.esc(that.keyOwner(k))+'</td><td>'+(k.key_type==='QR'?'🎫 QR':'💳 Ficha'+(k.nfc_card_number?' · '+that.esc(k.nfc_card_number):''))+'</td><td style="font-size:11px">'+that.esc(that.fmtKeyDate(k.valid_until))+'</td><td style="font-size:11px">'+that.esc(that.keyPerms(k))+'</td><td>'+that.keyStatusBadge(k)+'</td><td style="white-space:nowrap"><button class="btn btn-o btn-sm" @click="openKeyDetail('+k.id+')">Ver</button> <button class="btn btn-o btn-sm" @click="openKeyForm('+k.id+')" '+(k.status!=='ACTIVE'?'disabled':'')+'>Editar</button> <button class="btn btn-d btn-sm" @click="revokeKey('+k.id+')" '+(k.status!=='ACTIVE'?'disabled':'')+'>Revocar</button></td></tr>'}).join('')+'</table>'
      +(this.accessKeys.length?'':'<div class="empty"><h2>No hay llaves</h2><p>Crea una llave QR o asigna una ficha NFC a un trabajador o rol.</p><button class="btn btn-p" @click="openKeyForm()">+ Nueva llave</button></div>');
  },
  setKeyFilter(k,v){this.keyFilters[k]=v;this.loadKeys()},
  clearKeyFilters(){this.keyFilters={worker_id:'',status:'',q:''};this.loadKeys()},
  async openKeyForm(id){
    await Promise.all([this.loadWorkers(),this.loadWorkerRoles(),this.loadRoomTypes(),this.loadNfcCards()]);
    let that=this;let k=id?this.accessKeys.find(function(x){return x.id===id}):null;
    if(id&&!k){try{k=(await this.api('/api/v1/keys/'+id)).data}catch(e){this.toastErr(e.message);return}}
    let wOpts=this.workers.map(function(w){return '<option value="'+w.id+'"'+(k&&k.worker_id===w.id?' selected':'')+'>'+that.esc(w.name)+'</option>'}).join('');
    let rOpts=this.workerRoles.map(function(r){return '<option value="'+r.id+'"'+(k&&k.role_id===r.id?' selected':'')+'>'+that.esc(r.name)+'</option>'}).join('');
    let rtChecks=this.roomTypes.map(function(t){let checked=k&&(k.all_room_types||(k.room_type_ids||[]).includes(t.id))?'checked':'';return '<label style="display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0"><input type="checkbox" value="'+t.id+'" '+checked+' class="kf-rt" '+(k&&k.all_room_types?'disabled':'')+'> '+that.esc(t.name)+'</label>'}).join('');
    let available=this.nfcCards.filter(function(c){return c.status==='AVAILABLE'||(k&&c.id===k.nfc_card_id)});
    let nOpts='<option value="">— Selecciona una ficha —</option>'+available.map(function(c){return '<option value="'+c.id+'"'+(k&&k.nfc_card_id===c.id?' selected':'')+'>'+that.esc(c.number)+' · '+that.esc(c.code_masked||'')+'</option>'}).join('');
    let valid=k?String(k.valid_until).replace(' ','T').slice(0,16):'';
    this.modal.content='<h2>'+(id?'Editar llave':'Nueva llave')+'</h2>'
      +'<div class="field"><label>Etiqueta</label><input id="kf_label" value="'+this.esc(k?k.label:'')+'" placeholder="Llave de dirección"></div>'
      +'<div class="field"><label>Titular</label><select id="kf_owner_type" @change="keyOwnerTypeChanged()" '+(id?'disabled':'')+'><option value="WORKER"'+(k&&k.owner_type==='WORKER'?' selected':'')+'>Trabajador (personal)</option><option value="ROLE"'+(k&&k.owner_type==='ROLE'?' selected':'')+'>Rol (compartida y anónima)</option></select></div>'
      +'<div class="field"><label>Trabajador</label><select id="kf_worker" @change="prefillKeyPermissions()">'+wOpts+'</select></div>'
      +'<div class="field" id="kf_role_field"><label>Rol</label><select id="kf_role" @change="prefillKeyPermissions()">'+rOpts+'</select></div>'
      +'<div class="field"><label>Tipo de llave</label><select id="kf_key_type" @change="keyTypeChanged()" '+(id?'disabled':'')+'><option value="QR"'+(k&&k.key_type==='QR'?' selected':'')+'>QR</option><option value="NFC"'+(k&&k.key_type==='NFC'?' selected':'')+'>Ficha NFC</option></select></div>'
      +'<div class="field" id="kf_nfc_field"><label>Ficha NFC</label><select id="kf_nfc">'+nOpts+'</select><p class="field-hint">Solo aparecen fichas disponibles. La conexión con lectores NFC se configura aparte.</p></div>'
      +'<div class="field"><label>Fin de validez (UTC)</label><input type="datetime-local" id="kf_valid" value="'+valid+'"><p class="field-hint">La llave deja de abrir en este instante.</p></div>'
      +'<div class="field"><label><input type="checkbox" id="kf_all" @change="keyAllChanged()" '+(k&&k.all_room_types?'checked':'')+'> Todos los tipos de sala</label></div>'
      +'<div class="field"><label>Tipos de sala permitidos</label>'+rtChecks+'<p class="field-hint"><button class="btn btn-o btn-xs" type="button" @click="prefillKeyPermissions()">Cargar permisos del titular</button> Si no marcas nada se copian los del rol.</p></div>'
      +'<div class="field"><label>Notas</label><input id="kf_notes" value="'+this.esc(k?k.notes||'':'')+'"></div>'
      +'<div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="saveKey('+(id||0)+')">Guardar</button></div>';
    this.modal.show=true;
    this.keyOwnerTypeChanged();
    this.keyTypeChanged();
  },
  keyOwnerTypeChanged(){let t=document.getElementById('kf_owner_type');let w=document.getElementById('kf_worker');let rf=document.getElementById('kf_role_field');if(!t||!w||!rf)return;let isW=t.value==='WORKER';w.closest('.field').style.display=isW?'':'none';rf.style.display=isW?'none':''},
  keyTypeChanged(){let t=document.getElementById('kf_key_type');let f=document.getElementById('kf_nfc_field');if(t&&f)f.style.display=t.value==='NFC'?'':'none'},
  keyAllChanged(){let all=document.getElementById('kf_all');document.querySelectorAll('.kf-rt').forEach(function(c){if(all&&all.checked){c.checked=true;c.disabled=true}else{c.disabled=false}})},
  async prefillKeyPermissions(){try{let ot=document.getElementById('kf_owner_type');if(!ot)return;let q=ot.value==='WORKER'?('worker_id='+document.getElementById('kf_worker').value):('role_id='+document.getElementById('kf_role').value);let d=await this.api('/api/v1/keys/defaults?'+q);let ids=d.data.room_type_ids||[];document.querySelectorAll('.kf-rt').forEach(function(c){c.checked=ids.includes(parseInt(c.value))})}catch(e){this.toastErr(e.message)}},
  saveKey(id){
    let that=this;let ot=document.getElementById('kf_owner_type').value;let kt=document.getElementById('kf_key_type').value;
    let rtIds=[];document.querySelectorAll('.kf-rt:checked').forEach(function(c){rtIds.push(parseInt(c.value))});
    let body={label:document.getElementById('kf_label').value,valid_until:document.getElementById('kf_valid').value,all_room_types:document.getElementById('kf_all').checked,room_type_ids:rtIds,notes:document.getElementById('kf_notes').value||null};
    if(!id){body.owner_type=ot;body.key_type=kt;if(ot==='WORKER')body.worker_id=parseInt(document.getElementById('kf_worker').value);else body.role_id=parseInt(document.getElementById('kf_role').value);if(kt==='NFC')body.nfc_card_id=parseInt(document.getElementById('kf_nfc').value||0)}

  showKeyQr(token,label){

  downloadKeyQr(){

  async openKeyDetail(id){try{let k=(await this.api('/api/v1/keys/'+id)).data;let a=(await this.api('/api/v1/keys/'+id+'/accesses')).data||[];let that=this;

  // ── FICHAS NFC ──
  nfcPage(){let that=this;return '<div class="ph"><h1>💳 Fichas NFC</h1><p>'+this.nfcCards.length+' · <button class="btn btn-p btn-sm" @click="openNfcForm()">+ Nueva ficha</button></p></div>'

  },

  openNfcForm(id){let c=id?this.nfcCards.find(function(x){return x.id===id}):null;this.modal.content='<h2>'+(id?'Editar ficha':'Nueva ficha NFC')+'</h2><div class="field"><label>Número</label><input id="ncf_number" value="'+this.esc(c?c.number:'')+'" placeholder="F-001"></div>'+(id?'<p class="dim">El código de una ficha no se puede cambiar una vez creada.</p>':'<div class="field"><label>Código de la ficha</label><input id="ncf_code" placeholder="Código leído o asignado a la ficha"><p class="field-hint">Se guarda protegido (hash). Solo se mostrarán los últimos 4 caracteres.</p></div>')+'<div class="field"><label>Notas</label><input id="ncf_notes" value="'+this.esc(c?c.notes||'':'')+'"></div><div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="saveNfc('+(id||0)+')">Guardar</button></div>';this.modal.show=true},
  saveNfc(id){let that=this;let body={number:document.getElementById('ncf_number').value,notes:document.getElementById('ncf_notes').value||null};if(!id)body.code=document.getElementById('ncf_code').value;let url=id?'/api/v1/nfc-cards/'+id:'/api/v1/nfc-cards';this.api(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(){that.modal.show=false;that.loadNfcCards();that.toastOk(id?'Ficha actualizada':'Ficha creada')}).catch(function(e){that.toastErr(e.message)})},
  disableNfcCard(id){if(!confirm('¿Desactivar esta ficha?'))return;let that=this;this.api('/api/v1/nfc-cards/'+id,{method:'DELETE'}).then(function(){that.loadNfcCards();that.toastOk('Ficha desactivada')}).catch(function(e){that.toastErr(e.message)})},

  // ── ACCESOS ──

  openWorkerForm(id){
    let that=this;let w=id?this.workers.find(function(x){return x.id===id}):null;
    let rOpt=this.workerRoles.map(function(r){return'<option value="'+r.id+'"'+(w&&w.role_id===r.id?' selected':'')+'>'+that.esc(r.name)+'</option>'}).join('');
    this.modal.content='<h2>'+(id?'Editar':'Nuevo')+' trabajador</h2><div class="field"><label>Nombre</label><input id="wf_name" value="'+this.esc(w?w.name:'')+'"></div><div class="field"><label>Rol</label><select id="wf_role">'+rOpt+'</select></div><div class="field"><label>Notas</label><textarea id="wf_notes">'+this.esc(w?w.notes||'':'')+'</textarea></div><div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="saveWorker('+(id||0)+')">Guardar</button></div>';

  saveWorker(id){
    let that=this;
    let body={name:document.getElementById('wf_name').value,role_id:parseInt(document.getElementById('wf_role').value),notes:document.getElementById('wf_notes').value||null};
    let meth=id?'PATCH':'POST';let url=id?'/api/v1/workers/'+id:'/api/v1/workers';
    this.api(url,{method:meth,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(d){
      that.modal.show=false;that.loadWorkers();
      if(!id&&d.data&&d.data.qr_token){
        that.modal.content='<h2>✅ QR Maestro</h2><p class="dim">Guarda este token. <b>No se volverá a mostrar.</b></p><div class="qr-token" id="qr-token-text">'+that.esc(d.data.qr_token)+'</div><div class="actions"><button class="btn btn-p" onclick="navigator.clipboard.writeText(document.getElementById(\'qr-token-text\').textContent)">📋 Copiar</button><button class="btn btn-o" @click="modal.show=false">Cerrar</button></div>';
        that.modal.show=true;
      }else{that.toastOk(id?'Actualizado':'Creado')}
    }).catch(function(e){that.toastErr(e.message)});
  },

  deactivateWorker(id){

  regenerateWorkerQr(id){

  async saveRoom(id){
    let f=this.roomForm;
    if(!f.code||!f.code.trim()){this.toastErr('El código es obligatorio');return}
    if(!f.room_type_id){this.toastErr('Selecciona un tipo de sala');return}
    let that=this;
    try{
      let current=id?this.rooms.find(function(r){return r.id===id}):null;
      let body={code:f.code.trim(),room_type_id:parseInt(f.room_type_id),notes:f.notes&&f.notes.trim()?f.notes.trim():null};
      let room;
      if(id){room=await this.api('/api/v1/rooms/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
      else{room=await this.api('/api/v1/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
      let desired=f.pack_id?parseInt(f.pack_id):null;
      let currentPack=current?current.pack_id:null;
      if(desired){
        if(desired!==currentPack){await this.api('/api/v1/rooms/'+room.id+'/apply-pack/'+desired,{method:'POST'})}
      }else if(currentPack){
        await this.api('/api/v1/rooms/'+room.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack_id:null})});
      }
      this.modal.show=false;
      await this.loadDashboard();await this.loadPacks();
      this.toastOk(id?'Sala actualizada':'Sala creada');
    }catch(e){this.toastErr(e.message)}
  },

      return'<label class="chk-row"><input type="checkbox"'+(checked?' checked':'')+' @change="togglePkDev('+d.id+')"><span class="pdev-ic" style="--c:'+c+';--c-bg:'+bg+'">'+that.glyph(d.kind)+'</span><span class="chk-txt"><span>'+that.esc(d.label||that.KIND_NAME[d.kind]||d.kind)+'</span><span class="mono dim">'+d.kind+' · '+that.esc(d.external_id)+'</span></span><span class="chk-cur dim">'+cur+'</span></label>';
    }).join(''):'<div class="pdev pdev--empty">No hay dispositivos sin asignar para este pack.</div>';
    rows+='<button type="button" class="chk-row chk-row--add" @click="openDeviceForm(null,'+(p?p.id:0)+')"><span class="pdev-ic" style="--c:var(--accent);--c-bg:rgba(108,142,224,.12)">＋</span><span class="chk-txt"><span>Añadir dispositivo nuevo…</span><span class="mono dim">Se creará dentro de este pack</span></span></button>';
    let selCount=this.pkSel.length?' <span class="mono dim">('+this.pkSel.length+' seleccionado'+(this.pkSel.length===1?')':')s')+'</span>':'';
    this.modal.content='<h2>'+(p?'Editar pack':'Nuevo pack')+'</h2>'
      +'<div class="field"><label for="pkf_name">Nombre</label><input id="pkf_name" x-model="pkForm.name" placeholder="Pack recepción" autocomplete="off"><p class="field-hint">Nombre visible en todo el panel.</p></div>'
      +'<div class="field field--mono"><label for="pkf_code">Código</label><input id="pkf_code" x-model="pkForm.code" placeholder="PK_RECEPCION" autocomplete="off"><p class="field-hint">Se autocompleta desde el nombre si se deja vacío. Único.</p></div>'
      +'<div class="field"><label>Dispositivos del pack'+selCount+'</label><div class="dev-picker">'+rows+'</div><p class="field-hint">Solo se muestran dispositivos sin asignar y los ya miembros de este pack. Marca los que deben pertenecer a este pack.</p></div>'
      +'<div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="savePack('+(p?p.id:0)+')">Guardar pack</button></div>';
    this.modal.show=true;
    if(this.$nextTick){this.$nextTick(()=>{let el=document.getElementById('pkf_name');if(el)el.focus()})}
  },
  togglePkDev(id){let i=this.pkSel.indexOf(id);if(i>=0)this.pkSel.splice(i,1);else this.pkSel.push(id)},
  async savePack(id){
    let name=this.pkForm.name.trim();let code=this.pkForm.code.trim()||name.toUpperCase().replace(/[^A-Za-z0-9]+/g,'_');
    if(!name){this.toastErr('El nombre es obligatorio');return}
    try{
      let packId=id;
      let body={name:name,code:code};
      if(id){await this.api('/api/v1/device-packs/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
      else{let d=await this.api('/api/v1/device-packs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});packId=d.id}
      let prev=(id?((this.packs.find(x=>x.id===id)||{}).devices||[]):[]).map(x=>x.id);
      for(let did of prev){if(this.pkSel.indexOf(did)<0){await this.api('/api/v1/devices/'+did,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack_id:null})})}}
      for(let did of this.pkSel){if(prev.indexOf(did)<0){await this.api('/api/v1/devices/'+did,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({pack_id:packId})})}}
      this.modal.show=false;await this.loadPacks();this.toastOk(id?'Pack actualizado':'Pack creado');
    }catch(e){this.toastErr(e.message)}
  },
  async deletePack(id){
    if(!confirm('¿Eliminar el pack? Los dispositivos quedarán sin asignar.'))return;
    try{await this.api('/api/v1/device-packs/'+id,{method:'DELETE'});this.modal.show=false;await this.loadPacks();this.toastOk('Pack eliminado')}
    catch(e){this.toastErr(e.message)}
  },
  async openDeviceForm(id,presetPackId){
    await this.loadPacks();
    let d=id?this.devices.find(x=>x.id===id):null;
    let kind=d?d.kind:'RPI';
    this.devForm={kind:kind,subtype:d?(d.subtype||'CERRADURA'):'CERRADURA',effectiveSubtype:d?(d.subtype||'CERRADURA'):null,external_id:d?d.external_id:'',label:d?(d.label||''):'',pack_id:d?d.pack_id:(presetPackId||null),transport:d?(d.transport||'UNKNOWN'):'UNKNOWN',meta:d&&d.meta?Object.assign({},d.meta):{}};
    let that=this;
    let seg=this.DEV_KINDS.map(k=>{
      let dis=d?' disabled':'';
      return'<button type="button" role="radio" aria-checked="false" class="seg-btn" :class="devForm.kind===\''+k+'\'?\'act\':\'\'" :aria-checked="devForm.kind===\''+k+'\'" style="--c:'+that.KIND_COLOR[k]+';--c-bg:'+that.KIND_BG[k]+'" @click="devForm.kind=\''+k+'\'"'+dis+'>'+k+'</button>';
    }).join('');
    let haveCatalogue=Array.isArray(this.fwReleases)&&this.fwReleases.length>0;
    let subtypeSeg=this.ESP_VARIANTS.map(v=>{
      let hasRelease=!haveCatalogue||!!this.fwReleases.find(r=>r.variant===v);
      return'<button type="button" role="radio" aria-checked="false" class="seg-btn" :class="devForm.subtype===\''+v+'\'?\'act\':\'\'" :aria-checked="devForm.subtype===\''+v+'\'" data-variant="'+v+'"'+(hasRelease?'':' title="Sin firmware publicado para esta variante"')+' @click="devForm.subtype=\''+v+'\'">'+that.ESP_VARIANT_NAME[v]+(hasRelease?'':' <span class="dim">(sin firmware)</span>')+'</button>';
    }).join('');
    let activeOp=id?(this.fwOps[id]||null):null;
    let variantHint='<p class="field-hint">Debe coincidir con el sketch cargado. No cambia el hardware por sí solo.</p>';
    if(d&&kind==='RPI'){
      let eff=this.ESP_VARIANT_NAME[d.subtype||'CERRADURA']||(d.subtype||'CERRADURA');
      let bits=['Variante efectiva confirmada: <b>'+this.esc(eff)+'</b>.'];
      if(activeOp&&!activeOp.finished)bits.push('Cambio solicitado a <b>'+this.esc(this.ESP_VARIANT_NAME[activeOp.to_variant]||activeOp.to_variant)+'</b> · '+this.esc(activeOp.status_label||activeOp.status)+'.');
      if(d.meta&&(d.meta.ota_capable===true||d.meta.ota_protocol))bits.push('El cambio se aplica cuando el equipo reinicia con el firmware nuevo.');
      else bits.push('El equipo aún no anuncia OTA: el cambio requiere una carga inicial por cable.');
      variantHint='<p class="field-hint">'+bits.join(' ')+'</p>';
    }
    let packOpts=(d?'<option value="">Sin pack</option>':'')+this.packs.map(p=>'<option value="'+p.id+'"'+(this.devForm.pack_id===p.id?' selected':'')+'>'+that.esc(p.code)+' · '+that.esc(p.name)+'</option>').join('');
    if(!this.packs.length&&!d){packOpts='<option value="">Primero crea un pack</option>'}
    let transportOpts=[['UNKNOWN','Sin declarar'],['ZIGBEE2MQTT','Zigbee2MQTT local'],['TUYA','Tuya cloud'],['LOCAL','ESP32 / local'],['SIMULATED','Simulado']].map(function(x){return'<option value="'+x[0]+'"'+(that.devForm.transport===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('');
    let metaBlocks=this.DEV_KINDS.map(k=>{
      let fields=that.KIND_META[k]||{};
      return Object.keys(fields).map(key=>{
        let f=fields[key];
        return'<div class="field'+(f.mono?' field--mono':'')+'" x-show="devForm.kind===\''+k+'\'"><label for="dvf_'+k+'_'+key+'">'+f.label+'</label><input id="dvf_'+k+'_'+key+'" x-model="devForm.meta.'+key+'" placeholder="'+f.ph+'" autocomplete="off"></div>';
      }).join('');
    }).join('');
    let hint=d?'<p class="field-hint">El tipo no se puede cambiar: es la identidad física del hardware.</p>':'<p class="field-hint">'+that.KIND_HINT[kind]+'</p>';
    this.modal.content='<h2 id="modal-title">'+(d?'Editar dispositivo':'Nuevo dispositivo')+'</h2>'
      +'<div class="field"><label>Tipo de dispositivo</label><div class="seg" role="radiogroup" aria-label="Tipo de dispositivo">'+seg+'</div>'+hint+'</div>'
      +'<div class="field" x-show="devForm.kind===\'RPI\'"><label>Variante del ESP</label><div class="seg" role="radiogroup" aria-label="Variante del ESP">'+subtypeSeg+'</div>'+variantHint+'</div>'
      +'<div class="field field--mono"><label for="dvf_ext">ID externo</label><input id="dvf_ext" x-model="devForm.external_id" placeholder="wbr3-2f01" autocomplete="off"><p class="field-hint">Identificador físico estable: chip, MAC o IEEE del dispositivo.</p></div>'
      +'<div class="field"><label for="dvf_label">Etiqueta</label><input id="dvf_label" x-model="devForm.label" placeholder="Zigbee · Puerta · almacenZigbee" autocomplete="off"><p class="field-hint">Opcional. Nombre legible para el personal.</p></div>'
      +'<div class="field"><label for="dvf_transport">Origen / transporte</label><select id="dvf_transport" x-model="devForm.transport">'+transportOpts+'</select><p class="field-hint">Se declara explícitamente; no se infiere del tipo ni del nombre. Para el pack Zigbee usa <b>Zigbee2MQTT local</b>.</p></div>'
      +'<div class="field"><label for="dvf_pack">Pack</label><select id="dvf_pack" x-model="devForm.pack_id">'+packOpts+'</select><p class="field-hint">Un dispositivo debe pertenecer a un pack. La sala se resuelve por <code>pack → room</code>.</p></div>'
      +'<div id="dv-meta-fields">'+metaBlocks+'</div>'
      +'<div class="actions"><button class="btn btn-o" @click="modal.show=false">Cancelar</button><button class="btn btn-p" @click="saveDevice('+(d?d.id:0)+')">Guardar dispositivo</button></div>';
    this.modal.show=true;
    if(this.$nextTick){this.$nextTick(()=>{let el=document.getElementById('dvf_ext');if(el)el.focus()})}
  },
  async saveDevice(id){
    let f=this.devForm,k=f.kind;
    if(!f.external_id||!f.external_id.trim()){this.toastErr('El ID externo es obligatorio');return}
    if(!id&&!f.pack_id){this.toastErr('Selecciona un pack antes de crear el dispositivo');return}
    let prev=id?this.devices.find(x=>x.id===id):null;
    // Conserva metadatos de runtime (ota_capable, telemetría del actuador...)
    // que el formulario no edita; solo sustituye las claves declaradas.
    let meta=(prev&&prev.meta)?Object.assign({},prev.meta):Object.assign({},(f.meta||{}));
    Object.keys(this.KIND_META[k]||{}).forEach(key=>{
      delete meta[key];
      let v=(f.meta||{})[key];
      if(v!==undefined&&v!==null&&String(v).trim()!=='')meta[key]=String(v).trim();
    });
    let transport=(f.transport||'UNKNOWN').toUpperCase();
    let targetVariant=f.subtype||'CERRADURA';
    let effectiveVariant=f.effectiveSubtype||(prev?(prev.subtype||'CERRADURA'):targetVariant);
    let variantChanged=!!(id&&k==='RPI'&&effectiveVariant!==targetVariant);
    let activeOp=id?(this.fwOps[id]||null):null;
    let variantAlreadyRequested=!!(variantChanged&&activeOp&&!activeOp.finished&&activeOp.to_variant===targetVariant);
    let createdOp=null;
    try{
      if(variantChanged&&!variantAlreadyRequested){
        // La variante efectiva solo cambia con una operación OTA confirmada.
        // Se solicita antes del PATCH para no dejar el resto de campos a medias.
        let r=await this.api('/api/v1/devices/'+id+'/firmware-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({variant:targetVariant})});
        createdOp=(r&&r.operation)||null;
        if(createdOp)this.fwOps[id]=createdOp;
      }
      if(id){
        let body={external_id:f.external_id.trim(),label:f.label.trim()||null,pack_id:f.pack_id?parseInt(f.pack_id):null,transport:transport,meta:meta};
        if(k==='RPI'&&!variantChanged)body.subtype=targetVariant;
        await this.api('/api/v1/devices/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      }else{
        let body={kind:k,external_id:f.external_id.trim(),pack_id:parseInt(f.pack_id),transport:transport,meta:meta};
        if(k==='RPI')body.subtype=targetVariant;
        let d=await this.api('/api/v1/devices/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(f.label&&f.label.trim()){await this.api('/api/v1/devices/'+d.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:f.label.trim()})})}
      }
      this.modal.show=false;await this.loadPacks();
      if(this.p==='dv'){await this.loadDevices()}
      await this.loadFirmwareOps();
      if(variantChanged)this.toastOk('Dispositivo actualizado · cambio a '+this.ESP_VARIANT_NAME[targetVariant]+(variantAlreadyRequested?' ya solicitado':' solicitado')+'. Se aplicará al reiniciar con el firmware nuevo.');
      else this.toastOk(id?'Dispositivo actualizado':'Dispositivo creado');
    }catch(e){
      // Si la operación OTA ya se creó, se cancela para no dejar un cambio parcial.
      if(createdOp){try{await this.api('/api/v1/firmware-operations/'+createdOp.id+'/cancel',{method:'POST'})}catch(_e){}delete this.fwOps[id]}
      this.toastErr(this.deviceSaveError(e));
    }
  },
  deviceSaveError(e){
    let m={
      ota_not_capable:'Este ESP no anuncia soporte OTA. La variante solo puede cambiarse con una carga por cable.',
      firmware_release_not_found:'No hay firmware publicado para la variante elegida. Publica una versión antes de cambiar la variante.',
      firmware_operation_active:'Ya hay una actualización de firmware en curso para este dispositivo. Cancélala y vuelve a intentarlo.',
      firmware_update_required:'El cambio de variante requiere iniciar una actualización de firmware; vuelve a guardar.',
      device_external_id_taken:'Otro dispositivo del mismo tipo ya usa ese ID externo.',
      invalid_transport:'El origen o transporte seleccionado no es válido.',
      invalid_external_id:'El ID externo no es válido.',
      subtype_invalid:'La variante del ESP no es válida.',
      device_not_rpi:'Solo los ESP pueden cambiar de variante.'
    };
    return m[e&&e.code]||(e&&e.message)||'No se pudo guardar el dispositivo';
  },
  async deleteDevice(id){
    if(!confirm('¿Eliminar este dispositivo?'))return;
    try{await this.api('/api/v1/devices/'+id,{method:'DELETE'});await this.loadPacks();this.toastOk('Dispositivo eliminado')}
    catch(e){this.toastErr(e.message)}
  },
  async loadFirmwareOps(){
    try{let rel=await this.api('/api/v1/firmware/releases');this.fwReleases=rel.items||[]}catch(e){}
    let list=(this.devices||[]).filter(d=>d.kind==='RPI');
    for(let d of list){try{let r=await this.api('/api/v1/devices/'+d.id+'/firmware-operations');this.fwOps[d.id]=(r.items&&r.items[0])||null}catch(e){}}
  },
  async refreshFirmwareOps(){
    let list=(this.devices||[]).filter(d=>d.kind==='RPI');
    if(!list.length)return;
    for(let d of list){
      let op=this.fwOps[d.id];
      if(!op||op.finished)continue;
      try{let r=await this.api('/api/v1/firmware-operations/'+op.id);this.fwOps[d.id]=r;if(r.finished){await this.loadPacks();if(this.p==='dv')await this.loadDevices()}}catch(e){}
    }
  },
  async updateFirmware(id){
    let d=(this.devices||[]).find(x=>x.id===id);if(!d)return;
    let rel=(this.fwReleases||[]).find(r=>r.variant===(d.subtype||'CERRADURA'));
    let msg='¿Actualizar '+this.ESP_VARIANT_NAME[d.subtype||'CERRADURA']+' a la última versión publicada'+(rel?' ('+rel.version+')':'')+'?';
    if(!confirm(msg))return;
    try{
      let r=await this.api('/api/v1/devices/'+id+'/firmware-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({upgrade:true})});
      if(r.operation)this.fwOps[id]=r.operation;
      this.toastOk('Actualización solicitada');
    }catch(e){this.toastErr(this.deviceSaveError(e))}
  },
  async cancelFirmwareOp(id){
    let op=this.fwOps[id];if(!op)return;
    if(!confirm('¿Cancelar la actualización de firmware en curso?'))return;
    try{
      let r=await this.api('/api/v1/firmware-operations/'+op.id+'/cancel',{method:'POST'});
      this.fwOps[id]=r;await this.loadFirmwareOps();await this.loadDevices();
      this.toastOk('Actualización cancelada');
    }catch(e){this.toastErr(this.deviceSaveError(e))}
  },
  async identifyDevice(id){
    let d=this.devices.find(x=>x.id===id);if(!d)return;
    try{await this.api('/api/v1/devices/identify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({external_id:d.external_id,state:true})});this.toastOk('Localizando '+this.esc(d.label||d.kind)+'…')}
    catch(e){this.toastErr(e.message)}
  },
  settingsPage(){return'<div class="ph"><h1>⚙️ Configuración</h1></div>';},
  async loadSettings(){},
  async loadDeviceStatus(){}
}};
</script>
