<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Timbre · Almacén</title>
<style>
  :root{
    --bg:#07090d;
    --bg2:#0b0e13;
    --plate1:#1c212b;
    --plate2:#11151c;
    --line:#2a2f3a;
    --line2:#3a414f;
    --fg:#e6e9ee;
    --muted:#8b93a1;
    --ok:#2ecc71;
    --warn:#f1c40f;
    --bad:#e74c3c;
    --accent:#4f8cff;
    --accent2:#2f6fe0;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:clamp(8px,1.5vw,18px);
    background:
      radial-gradient(120% 80% at 50% -10%, #151b25 0%, transparent 60%),
      radial-gradient(90% 70% at 100% 110%, rgba(79,140,255,.08) 0%, transparent 55%),
      var(--bg2);
    color:var(--fg);
    font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .intercom{
    width:min(1180px,100%);
    display:grid;
    gap:clamp(8px,1.2vw,14px);
    --signal:var(--line);
    --signal-glow:transparent;
  }

  /* ── Placa superior ─────────────────────────────────────────────── */
  .plate-head{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    padding:10px 16px;
    border:1px solid var(--line);
    border-radius:16px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), transparent 38%),
      linear-gradient(180deg,var(--plate1),var(--plate2));
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -30px #000;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:160px}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;
    display:grid;place-items:center;
    color:#cfe0ff;
    background:linear-gradient(160deg,#2a3242,#141922);
    border:1px solid var(--line2);
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
    font-size:14px;
  }
  .brand-name{font-size:13px;letter-spacing:.32em;font-weight:700;color:#c7cfdb}
  .brand-sub{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .room-pick{
    display:flex;align-items:center;gap:9px;
    margin-left:auto;
    padding:6px 10px 6px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:linear-gradient(180deg,#0d1117,#151a22);
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
  }
  .room-pick > span{
    font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;white-space:nowrap;
  }
  #room-select{
    appearance:none;
    background:#0a0d12 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238b93a1' stroke-width='1.4' stroke-linecap='round'/></svg>") no-repeat right 9px center;
    color:var(--fg);
    border:0;outline:0;
    padding:4px 26px 4px 4px;
    font:inherit;font-weight:600;
    min-width:120px;max-width:220px;
    cursor:pointer;
  }
  #room-select:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:6px}
  .net{
    display:inline-flex;align-items:center;gap:7px;
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;
  }
  .net::before{
    content:"";width:7px;height:7px;border-radius:50%;
    background:var(--muted);box-shadow:0 0 0 3px rgba(139,147,161,.12);
  }
  .net[data-tone="ok"]{color:var(--ok)}
  .net[data-tone="ok"]::before{background:var(--ok);box-shadow:0 0 0 3px rgba(46,204,113,.15)}
  .net[data-tone="warn"]{color:var(--warn)}
  .net[data-tone="warn"]::before{background:var(--warn);box-shadow:0 0 0 3px rgba(241,196,15,.14)}
  .net[data-tone="bad"]{color:var(--bad)}
  .net[data-tone="bad"]::before{background:var(--bad);box-shadow:0 0 0 3px rgba(231,76,60,.14)}

  /* ── Visera / cámara ────────────────────────────────────────────── */
  .visor{
    position:relative;
    width:100%;
    max-width:min(1180px, calc((100dvh - 420px) * 16 / 9));
    margin:0 auto;
    padding:clamp(9px,1.1vw,13px);
    border:1px solid var(--line);
    border-radius:clamp(20px,2vw,26px);
    background:
      linear-gradient(180deg, rgba(255,255,255,.06), transparent 30%),
      linear-gradient(180deg,#212733 0%,#121720 58%,#0b0e13 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.07) inset,
      0 -1px 0 rgba(0,0,0,.7) inset,
      0 34px 70px -40px #000,
      0 24px 54px -42px var(--signal-glow);
    transition:box-shadow .35s ease;
  }
  .presence-edge{
    position:absolute;inset:0;
    border:clamp(6px,.75vw,9px) solid var(--signal);
    border-radius:inherit;
    pointer-events:none;
    box-shadow:inset 0 0 0 2px #05070a;
    transition:border-color .3s ease, box-shadow .35s ease;
  }
  .visor-bezel{display:grid;gap:8px}
  .visor-top,.visor-foot{
    display:flex;align-items:center;gap:10px;
    padding:0 6px;
    min-height:22px;
  }
  .visor-top{justify-content:space-between}
  .visor-tag{
    font-size:10px;letter-spacing:.28em;font-weight:700;text-transform:uppercase;
    color:#c3cede;
    padding:3px 9px;border-radius:999px;
    border:1px solid var(--line2);
    background:rgba(0,0,0,.22);
  }
  .visor-cam{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage{
    position:relative;
    aspect-ratio:16 / 9;
    width:100%;
    border-radius:clamp(14px,1.5vw,19px);
    background:#05070a;
    overflow:hidden;
    box-shadow:0 0 0 1px #05070a, 0 0 0 2px rgba(255,255,255,.045) inset;
  }
  .cam-stream{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;
    background:#05070a;
    display:block;
  }
  .cam-stream[hidden]{display:none}
  .cam-fallback{
    position:absolute;inset:0;
    display:grid;place-items:center;align-content:center;gap:12px;
    padding:22px;
    text-align:center;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
      radial-gradient(90% 90% at 50% 30%, #10151d 0%, #05070a 75%);
  }
  .cam-fallback[hidden]{display:none}
  .fallback-icon{font-size:30px;color:var(--line2);line-height:1}
  #cam-message{margin:0;color:var(--muted);font-size:13px;letter-spacing:.02em;max-width:34ch}
  .chip-btn{
    appearance:none;cursor:pointer;
    color:var(--fg);
    background:linear-gradient(180deg,#242b37,#171c25);
    border:1px solid var(--line2);
    border-radius:999px;
    padding:8px 16px;
    font:inherit;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
    box-shadow:0 1px 0 rgba(255,255,255,.07) inset;
    transition:transform .12s ease, border-color .2s ease, background .2s ease;
  }
  .chip-btn:hover{border-color:#55617a;background:linear-gradient(180deg,#2b3442,#1a202a)}
  .chip-btn:active{transform:translateY(1px)}
  .chip-btn[hidden]{display:none}
  .chip-btn:disabled{opacity:.55;cursor:progress;transform:none}
  .chip-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .visor-foot{
    justify-content:flex-start;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  }
  .signal-dot{
    width:8px;height:8px;border-radius:50%;background:var(--muted);
    box-shadow:0 0 0 3px rgba(139,147,161,.12);
    transition:background .25s ease, box-shadow .25s ease;
  }

  /* Presencia: solo el marco. Verde únicamente con PRESENT fresco. */
  .intercom[data-presence="present"]{--signal:var(--ok);--signal-glow:rgba(46,204,113,.26)}
  .intercom[data-presence="present"] .signal-dot{background:var(--ok);box-shadow:0 0 0 3px rgba(46,204,113,.18)}
  .intercom[data-presence="present"] #presence-label{color:var(--ok)}
  .intercom[data-presence="stale"]{--signal:var(--warn);--signal-glow:rgba(241,196,15,.16)}
  .intercom[data-presence="stale"] .presence-edge{border-style:dashed}
  .intercom[data-presence="stale"] .signal-dot{background:var(--warn);box-shadow:0 0 0 3px rgba(241,196,15,.16)}
  .intercom[data-presence="stale"] #presence-label{color:var(--warn)}
  .intercom[data-presence="candidate"]{--signal:var(--warn);--signal-glow:rgba(241,196,15,.10)}
  .intercom[data-presence="candidate"] .signal-dot{background:var(--warn);box-shadow:0 0 0 3px rgba(241,196,15,.14)}
  .intercom[data-presence="candidate"] #presence-label{color:var(--warn)}
  .intercom[data-presence="absent"] #presence-label{color:var(--muted)}
  .intercom[data-presence="unknown"] #presence-label{color:var(--muted)}

  /* ── Placa inferior: puerta + pulsador + estado ─────────────────── */
  .deck{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    align-items:center;
    gap:clamp(12px,2vw,26px);
    padding:clamp(10px,1.3vw,15px) clamp(14px,2vw,22px);
    border:1px solid var(--line);
    border-radius:20px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), transparent 40%),
      linear-gradient(180deg,#1a1f28,#0f131a);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 30px 60px -44px #000;
  }
  .door-panel{display:flex;align-items:center;gap:14px;min-width:0}
  .door-svg{
    width:clamp(66px,7.6vw,86px);
    height:auto;flex:0 0 auto;
    overflow:visible;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));
  }
  .door-frame{fill:none;stroke:var(--line2);stroke-width:3;stroke-linecap:round}
  .door-gap{fill:#05070a}
  .door-leaf{fill:url(#doorFace);stroke:#7f8ea8;stroke-width:2}
  .door-leaf-group{transform-box:view-box;transform-origin:0% 50%;transition:transform .42s cubic-bezier(.16,1,.3,1)}
  .door-handle{fill:#c9d4e6;stroke:#1a202a;stroke-width:1}
  .door-glow{fill:var(--warn);opacity:0;transition:opacity .35s ease}
  .door-svg.is-open .door-leaf-group{transform:rotate(-78deg)}
  .door-svg.is-open .door-glow{opacity:.9}
  .door-svg.is-unknown{opacity:.55}
  .door-svg.is-unknown .door-frame{stroke-dasharray:5 5}
  .door-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
  .door-kicker,.status-kicker{
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  }
  #door-label{font-size:clamp(17px,1.7vw,21px);letter-spacing:.08em;font-weight:750}
  .intercom[data-door="open"] #door-label{color:var(--ok)}
  .intercom[data-door="closed"] #door-label{color:var(--fg)}
  .intercom[data-door="unknown"] #door-label{color:var(--warn)}

  .bell{display:flex;flex-direction:column;align-items:center;gap:9px}
  .bell-btn{
    position:relative;
    appearance:none;
    width:clamp(92px,10vw,118px);
    aspect-ratio:1;
    border-radius:50%;
    border:1px solid #46536b;
    cursor:pointer;
    color:#eaf1ff;
    background:
      radial-gradient(80% 60% at 50% 18%, rgba(255,255,255,.14), transparent 60%),
      linear-gradient(180deg,#2a3342 0%,#151a22 62%,#0c1016 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.16) inset,
      0 -2px 0 rgba(0,0,0,.75) inset,
      0 16px 28px -18px #000,
      0 0 0 6px rgba(79,140,255,.08);
    display:grid;place-items:center;
    transition:transform .12s ease, box-shadow .2s ease, border-color .2s ease;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .bell-btn:hover{border-color:#5f7396;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -2px 0 rgba(0,0,0,.75) inset,0 18px 32px -18px #000,0 0 0 6px rgba(79,140,255,.14)}
  .bell-btn:active{transform:translateY(2px) scale(.992)}
  .bell-btn:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
  .bell-btn:disabled{cursor:progress}
  .bell-btn.is-busy{border-color:var(--accent)}
  .bell-btn.is-ok{border-color:var(--ok);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 -2px 0 rgba(0,0,0,.75) inset,0 16px 28px -18px #000,0 0 0 6px rgba(46,204,113,.16)}
  .bell-btn.is-error{border-color:var(--bad);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 -2px 0 rgba(0,0,0,.75) inset,0 16px 28px -18px #000,0 0 0 6px rgba(231,76,60,.16)}
  .bell-btn.is-cooldown{opacity:.7}
  .bell-ring{
    position:absolute;inset:-7px;border-radius:50%;
    border:2px solid transparent;pointer-events:none;
  }
  .bell-btn.is-busy .bell-ring{
    border-color:rgba(79,140,255,.18);
    border-top-color:var(--accent);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .bell-face{display:flex;flex-direction:column;align-items:center;gap:7px}
  .bell-icon{width:26px;height:26px;display:block;color:#bcd2ff}
  .bell-text{
    font-size:clamp(12px,1.1vw,14px);
    font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    line-height:1;
  }
  .bell-btn.is-ok .bell-icon{color:var(--ok)}
  .bell-btn.is-ok .bell-text{color:var(--ok)}
  .bell-btn.is-error .bell-icon{color:var(--bad)}
  .bell-btn.is-error .bell-text{color:var(--bad)}
  .hint{
    margin:0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    text-align:center;
  }
  .status-panel{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;min-width:0}
  #last-open{font-family:var(--mono);font-size:clamp(20px,2vw,26px);letter-spacing:.04em;color:#dfe7f3}
  .action-status{font-size:12px;color:var(--muted);min-height:1.2em;max-width:26ch}
  .action-status[data-tone="ok"]{color:var(--ok)}
  .action-status[data-tone="warn"]{color:var(--warn)}
  .action-status[data-tone="bad"]{color:var(--bad)}
  .action-status[data-tone="busy"]{color:#9db9ff}

  #toast{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);
    background:#161b23;border:1px solid var(--line2);border-radius:12px;
    padding:10px 16px;font-size:13px;color:var(--fg);
    box-shadow:0 18px 40px -18px #000;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    max-width:min(92vw,520px);text-align:center;z-index:20;
  }
  #toast.is-visible{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast[data-tone="bad"]{border-color:rgba(231,76,60,.5)}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ── Responsive ─────────────────────────────────────────────────── */
  @media (max-width:820px){
    .deck{grid-template-columns:1fr;gap:14px;padding:14px}
    .bell{order:-1}
    .door-panel{justify-content:center}
    .status-panel{align-items:center;text-align:center}
    .action-status{max-width:none}
    .visor{max-width:100%}
  }
  @media (max-width:560px){
    body{padding:8px}
    .plate-head{padding:9px 12px;gap:10px}
    .brand{min-width:0}
    .brand-sub{display:none}
    .room-pick{margin-left:auto;flex:1 1 auto;justify-content:space-between}
    .net{display:none}
    .deck{gap:12px}
    .door-panel{gap:10px}
    .status-panel{gap:2px}
    #last-open{font-size:22px}
  }
  @media (prefers-reduced-motion: reduce){
    .door-leaf-group,.door-glow,.presence-edge,.visor,.signal-dot,#toast{transition:none!important}
    .bell-btn.is-busy .bell-ring{animation:none!important;border-top-color:var(--accent);border-color:var(--accent)}
  }
</style>
</head>
<body>
<main id="app" class="intercom" data-presence="unknown" data-door="unknown" data-camera="loading">
  <header class="plate-head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">&#9672;</span>
      <span>
        <span class="brand-name">TIMBRE</span><br>
        <span class="brand-sub">Almacén de bebidas</span>
      </span>
    </div>
    <label class="room-pick">
      <span>Almacén</span>
      <select id="room-select" aria-label="Seleccionar almacén"></select>
    </label>
    <span id="net-status" class="net" data-tone="warn" role="status">Conectando</span>
  </header>

  <section id="timbre-frame" class="visor" aria-label="Cámara interior del almacén">
    <div class="visor-bezel">
      <div class="visor-top">
        <span class="visor-tag">Interior</span>
        <span id="cam-label" class="visor-cam">cámara interior</span>
      </div>
      <div id="stage" class="stage">
        <img id="cam-interior" class="cam-stream" alt="Cámara interior del almacén" hidden>
        <div id="cam-fallback" class="cam-fallback">
          <div class="fallback-icon" aria-hidden="true">&#9635;</div>
          <p id="cam-message">Conectando cámara…</p>
          <button id="btn-cam-enable" class="chip-btn" type="button" hidden>Encender cámara</button>
          <button id="btn-cam-retry" class="chip-btn" type="button" hidden>Reintentar</button>
        </div>
      </div>
      <div class="visor-foot">
        <span id="presence-dot" class="signal-dot" aria-hidden="true"></span>
        <span id="presence-label" role="status" aria-live="polite">SIN DATOS</span>
      </div>
    </div>
    <div class="presence-edge" aria-hidden="true"></div>
  </section>

  <section class="deck" aria-label="Controles del timbre">
    <div id="door-panel" class="door-panel">
      <svg id="door-visual" class="door-svg is-unknown" viewBox="0 0 120 100" role="img" aria-labelledby="door-title">
        <title id="door-title">Estado de la puerta: sin datos</title>
        <defs>
          <linearGradient id="doorFace" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2c3644"/>
            <stop offset="1" stop-color="#161c25"/>
          </linearGradient>
        </defs>
        <rect class="door-gap" x="22" y="12" width="76" height="76" rx="3"/>
        <rect class="door-glow" x="26" y="16" width="68" height="68" rx="2"/>
        <g id="door-leaf" class="door-leaf-group">
          <rect class="door-leaf" x="22" y="12" width="76" height="76" rx="3"/>
          <circle class="door-handle" cx="86" cy="52" r="3.6"/>
        </g>
        <path class="door-frame" d="M16 94V8h88v86"/>
      </svg>
      <div class="door-copy">
        <span class="door-kicker">Puerta</span>
        <strong id="door-label" role="status" aria-live="polite">SIN DATOS</strong>
      </div>
    </div>

    <div class="bell">
      <button id="btn-open" class="bell-btn" type="button" aria-describedby="open-hint">
        <span class="bell-ring" aria-hidden="true"></span>
        <span class="bell-face">
          <svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 10a5 5 0 0 1 10 0v4l1.5 2.5H5.5L7 14v-4Z"/>
            <path d="M10 19a2 2 0 0 0 4 0"/>
            <path d="M12 3v2"/>
          </svg>
          <span id="open-text" class="bell-text">Abrir</span>
        </span>
      </button>
      <p id="open-hint" class="hint">Pulsa para abrir la cerradura</p>
    </div>

    <div class="status-panel">
      <span class="status-kicker">Última apertura</span>
      <span id="last-open" class="mono">—</span>
      <span id="action-status" class="action-status" role="status" aria-live="assertive"></span>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="assets/timbre-logic.js"></script>
<script src="assets/timbre.js"></script>
</body>
</html>
