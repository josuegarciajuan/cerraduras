<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Gestión de llaves — Hotel Vía Valentia</title>
<meta name="theme-color" content="#0c4b7f">
<link rel="stylesheet" href="/llaves/assets/brand-tokens.css">
<style>
  :root {
    --paper: var(--vv-paper, #f6f3ec);
    --surface: var(--vv-surface, #fffdf8);
    --surface-2: var(--vv-surface-2, #f2eee5);
    --ink: var(--vv-ink, #17212b);
    --ink-soft: var(--vv-ink-soft, #33414f);
    --muted: var(--vv-muted, #59636e);
    --line: var(--vv-line, #d5cfc1);
    --line-strong: var(--vv-line-strong, #a8a193);
    --accent: var(--vv-blue, #0c4b7f);
    --accent-strong: var(--vv-blue-strong, #083a63);
    --accent-soft: var(--vv-blue-soft, #e6eef6);
    --accent-ink: var(--vv-blue-ink, #062f50);
    --brand-gold: var(--vv-gold, #dea139);
    --danger: var(--vv-danger, #9f2626);
    --danger-strong: var(--vv-danger-strong, #7f1d1d);
    --danger-soft: var(--vv-danger-soft, #f9e4e1);
    --focus: var(--vv-focus, #0c4b7f);
    --shadow: var(--vv-shadow, 0 30px 80px -40px rgba(23, 33, 43, .55));
    --font-ui: var(--vv-font-ui, "Heebo", "Lato", "Segoe UI", system-ui, -apple-system, sans-serif);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,.9), transparent 34rem),
      linear-gradient(160deg, #f8f6f0 0%, var(--paper) 55%, #ece8dd 100%);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 18px;
    line-height: 1.55;
  }
  button, input { font: inherit; }
  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
    border-radius: 8px;
  }
  .wrap { width: min(460px, 100%); }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 5px solid var(--brand-gold);
    border-radius: 26px;
    padding: clamp(26px, 6vw, 42px);
    box-shadow: var(--shadow);
  }
  .brand {
    margin-bottom: 24px;
  }
  .brand-logo {
    display: block;
    width: auto;
    height: 62px;
    max-width: 100%;
  }
  .brand-rule {
    width: 54px;
    height: 4px;
    margin-top: 16px;
    border-radius: 999px;
    background: var(--brand-gold);
  }
  h1 {
    margin: 0;
    color: var(--accent-ink);
    font-size: clamp(30px, 7vw, 38px);
    line-height: 1.05;
    letter-spacing: -.035em;
  }
  .subtitle {
    margin: 9px 0 28px;
    color: var(--muted);
    font-size: 17px;
  }
  .alert {
    display: none;
    align-items: flex-start;
    gap: 10px;
    margin: 0 0 20px;
    padding: 14px 16px;
    border: 1px solid rgba(159, 38, 38, .35);
    border-radius: 13px;
    background: var(--danger-soft);
    color: var(--danger-strong);
    font-size: 16px;
    font-weight: 600;
  }
  .alert.show { display: flex; }
  .alert svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .field label { font-size: 16px; font-weight: 700; color: var(--ink-soft); }
  input {
    width: 100%;
    min-height: 58px;
    padding: 13px 16px;
    border: 2px solid var(--line-strong);
    border-radius: 13px;
    background: var(--surface);
    color: var(--ink);
    font-size: 18px;
  }
  input:focus {
    border-color: var(--accent);
    outline: 3px solid rgba(12, 75, 127, .28);
    outline-offset: 1px;
  }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 64px; }
  .toggle-password {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle-password:hover { background: var(--surface-2); color: var(--ink); }
  .toggle-password svg { width: 23px; height: 23px; }
  .toggle-password svg[hidden] { display: none; }
  .submit {
    width: 100%;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 0;
    border-radius: 15px;
    background: var(--accent);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 18px 36px -22px rgba(12, 75, 127, .95);
    transition: background .18s ease, transform .18s ease;
  }
  .submit:hover { background: var(--accent-strong); }
  .submit:active { transform: translateY(1px); }
  .submit[disabled] { opacity: .6; cursor: not-allowed; transform: none; }
  .submit svg { width: 24px; height: 24px; }
  .foot {
    margin: 22px 0 0;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }
  .foot a { color: var(--accent-ink); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="brand">
      <img class="brand-logo" src="/llaves/assets/via-valentia-logo.png"
           alt="Hotel Vía Valentia" width="181" height="56">
      <div class="brand-rule" aria-hidden="true"></div>
    </div>
    <h1>Gestión de llaves</h1>
    <p class="subtitle">Acceso para el encargado</p>

    <div id="form-error" class="alert" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v6"></path>
        <path d="M12 17h.01"></path>
      </svg>
      <span id="form-error-text"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="toggle-password" class="toggle-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="2.6"></circle>
            </svg>
            <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <path d="m3 3 18 18"></path>
              <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.6 17.6 0 0 1-3.2 3.8"></path>
              <path d="M6.2 6.3C3.6 8.1 2 12 2 12s3.5 6 10 6c1.3 0 2.5-.2 3.6-.7"></path>
            </svg>
          </button>
        </div>
      </div>
      <button id="submit" class="submit" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path>
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H4"></path>
        </svg>
        <span id="submit-text">Entrar</span>
      </button>
    </form>
    <p class="foot">¿No puedes entrar? Pide ayuda al administrador.</p>
  </div>
</main>

<script>
(function () {
  'use strict';

  var form = document.getElementById('login-form');
  var username = document.getElementById('username');
  var password = document.getElementById('password');
  var submit = document.getElementById('submit');
  var submitText = document.getElementById('submit-text');
  var errorBox = document.getElementById('form-error');
  var errorText = document.getElementById('form-error-text');
  var toggle = document.getElementById('toggle-password');
  var eyeOpen = document.getElementById('eye-open');
  var eyeClosed = document.getElementById('eye-closed');
  var loading = false;

  function showError(message) {
    errorText.textContent = message;
    errorBox.classList.add('show');
  }

  function clearError() {
    errorText.textContent = '';
    errorBox.classList.remove('show');
  }

  function setLoading(value) {
    loading = value;
    submit.disabled = value;
    submitText.textContent = value ? 'Entrando…' : 'Entrar';
  }

  username.addEventListener('input', clearError);
  password.addEventListener('input', clearError);

  toggle.addEventListener('click', function () {
    var showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    toggle.setAttribute('aria-pressed', showing ? 'false' : 'true');
    toggle.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
    eyeOpen.hidden = !showing;
    eyeClosed.hidden = showing;
    password.focus();
  });

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    if (loading) return;
    clearError();

    var user = username.value.trim();
    if (!user) {
      showError('Escribe tu usuario.');
      username.focus();
      return;
    }
    if (!password.value) {
      showError('Escribe tu contraseña.');
      password.focus();
      return;
    }

    setLoading(true);
    try {
      var response = await fetch('/api/v1/crm/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: password.value })
      });

      var body = await response.json().catch(function () { return {}; });

      if (response.ok) {
        window.location.href = '/llaves';
        return;
      }

      if (response.status === 401) {
        showError('Usuario o contraseña incorrectos.');
      } else if (response.status === 403) {
        showError('Tu cuenta está deshabilitada. Habla con el administrador.');
      } else {
        showError((body && body.error && body.error.message) || (body && body.message) || 'No se pudo entrar. Inténtalo de nuevo.');
      }
    } catch (err) {
      showError('No se pudo conectar. Revisa la conexión e inténtalo de nuevo.');
    } finally {
      setLoading(false);
    }
  });

  // A valid CRM session should not see the login form again.
  (async function checkSession() {
    try {
      var response = await fetch('/api/v1/crm/me', { credentials: 'same-origin' });
      if (response.ok) {
        window.location.replace('/llaves');
      }
    } catch (err) {
      // Offline or API unavailable: keep the form usable.
    }
  })();

  username.focus();
})();
</script>
</body>
</html>
